
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91d0f4;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.logo,.stat{background:#293c36e8;color:white;border-radius:14px;padding:9px 12px;box-shadow:0 3px 12px #263b3540}
.logo{font-weight:900;font-size:17px}
.stats{display:flex;gap:6px}
.stat{text-align:center;min-width:58px}
.stat small{display:block;font-size:9px;letter-spacing:1px;color:#d9e8dd}
.stat strong{font-size:21px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#172b2966;padding:20px;z-index:5}
.panel{width:min(390px,100%);background:#fff8e9;color:#293a32;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 15px 45px #243b3c66}
.panel h1{font-size:clamp(27px,7vw,38px);margin:0 0 12px}
.panel p{line-height:1.7}
.panel .result{font-size:25px;font-weight:900;margin:20px 0}
.intro{font-size:clamp(25px,7vw,35px);font-weight:1000;line-height:1.3;margin:0 0 15px;color:#a34b2e}
.intro-sub{font-weight:800;font-size:16px;line-height:1.7}
.intro-small{font-size:13px;color:#786c5b;margin:18px 0}
button{background:#e9a64c;color:#34271c;border:0;border-radius:14px;padding:14px 32px;font-size:17px;font-weight:900}
.hidden{display:none!important}
#hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:white;font-weight:800;text-shadow:0 2px 5px #263b35;pointer-events:none;z-index:2;font-size:13px}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="logo">환상의 짝꿍</div>
  <div class="stats">
    <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
    <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
  </div>
</div>

<div id="hint" class="hidden">아래로 드래그: 받기　/　위로 드래그: 쳐내기</div>

<div class="overlay" id="start">
  <div class="panel">
    <h1>환상의 짝꿍</h1>
    <div class="intro">나는 최고의<br>소매치기!</div>
    <div class="intro-sub">
      쥐도 새도 모르게 지갑만 쏙!<br>
      여유로운 행인의 주머니를 털어라!
    </div>
    <p class="intro-small">
      덕형과 한길의 완벽한 팀워크.<br>
      자경이에게 들키지 않고 작전을 성공시켜라!
    </p>
    <button id="startBtn">작전 시작</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <h1>지금 뭐 하시는 거예요?</h1>
    <p>자경이에게 들켰습니다!</p>
    <div class="result" id="result">훔친 물건 0개</div>
    <button id="again">다시 도전하기</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=id=>document.getElementById(id);

// ========================================
// 기본 장면
// ========================================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d0f4);
scene.fog=new THREE.Fog(0x91d0f4,30,65);

const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.1,6.9);
camera.lookAt(0,2.35,.1);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));

const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// ========================================
// 도형 도우미
// ========================================
function mat(color,roughness=.85){
  return new THREE.MeshStandardMaterial({color,roughness});
}

function roundedBox(parent,color,pos,size,radius=.08){
  const geo=new RoundedBoxGeometry(size[0],size[1],size[2],4,radius);
  const m=new THREE.Mesh(geo,mat(color));
  m.position.set(...pos);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function sphere(parent,color,pos,scale=[1,1,1]){
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(.5,24,18),mat(color)
  );
  m.position.set(...pos);
  m.scale.set(...scale);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function capsule(parent,color,pos,radius,length,rotation=[0,0,0]){
  const m=new THREE.Mesh(
    new THREE.CapsuleGeometry(radius,length,6,16),mat(color)
  );
  m.position.set(...pos);
  m.rotation.set(...rotation);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function makeLimb(color,radius){
  const mesh=new THREE.Mesh(
    new THREE.CapsuleGeometry(radius,1,6,16),
    mat(color)
  );
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  return mesh;
}

function placeLimb(mesh,a,b){
  const start=new THREE.Vector3(...a);
  const end=new THREE.Vector3(...b);
  const direction=new THREE.Vector3().subVectors(end,start);
  const length=direction.length();

  mesh.position.copy(start).add(end).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),direction.normalize()
  );
  mesh.scale.set(1,length,1);
}

// ========================================
// 배경
// ========================================
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),mat(0x8da96b)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(
  new THREE.PlaneGeometry(7,65),mat(0xb9956d)
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.07,-12);
road.receiveShadow=true;
scene.add(road);

// 자갈
for(let i=0;i<65;i++){
  const s=.035+Math.random()*.1;
  const stone=new THREE.Mesh(
    new THREE.DodecahedronGeometry(s),
    mat(Math.random()>.5?0x8d806c:0xb7a18a)
  );
  stone.position.set((Math.random()-.5)*5.8,-.015,-30+Math.random()*35);
  stone.scale.set(1.5,.4,1);
  scene.add(stone);
}

// 풀
for(let i=0;i<70;i++){
  const side=Math.random()>.5?1:-1;
  const x=side*(4+Math.random()*7);
  const z=-28+Math.random()*35;
  capsule(scene,0x547b45,[x,.2,z],.035,.35,[0,0,(Math.random()-.5)*.8]);
  if(i%5===0)sphere(scene,0xe8d99b,[x,.45,z],[.16,.16,.16]);
}

// 울타리
for(const side of [-1,1]){
  for(let i=0;i<10;i++){
    roundedBox(scene,0x806044,[side*5.2,.55,-27+i*3],[.16,1.1,.16],.04);
  }
  for(const y of [.45,.85]){
    roundedBox(scene,0x9a7955,[side*5.2,y,-13],[.13,.13,30],.04);
  }
}

// 언덕과 구름
for(let i=0;i<12;i++){
  const h=2+Math.random()*3;
  sphere(scene,0x739a70,[-22+i*4,h*.25,-27],[7,h*2,4]);
}

for(let i=0;i<8;i++){
  const cloud=new THREE.Group();
  sphere(cloud,0xfaf8ed,[0,0,0],[3,.9,1.4]);
  sphere(cloud,0xfaf8ed,[-.8,-.1,.05],[1.7,.8,1.2]);
  sphere(cloud,0xfaf8ed,[.85,-.1,0],[1.8,.9,1.2]);
  cloud.position.set(-14+i*4,9+(i%3),-20);
  scene.add(cloud);
}

// ========================================
// 자경이
// 얼굴과 몸의 스타일 통일
// ========================================
const victim=new THREE.Group();
scene.add(victim);
victim.position.set(0,0,-.15);
victim.scale.setScalar(1.3);

// 하체
const lower=new THREE.Group();
lower.position.y=.78;
victim.add(lower);

roundedBox(lower,0x514237,[0,-.05,0],[.9,.58,.58],.12);

for(const side of [-1,1]){
  const leg=new THREE.Group();
  leg.position.set(side*.25,-.28,0);
  lower.add(leg);
  capsule(leg,0x514237,[0,-.4,0],.18,.65);
  roundedBox(leg,0x40362e,[0,-.88,.12],[.38,.19,.56],.07);
}

// 몸통
const torso=new THREE.Group();
torso.position.y=1.48;
victim.add(torso);

roundedBox(torso,0xf0eee5,[0,0,0],[1.12,1.38,.62],.13);

// 목
roundedBox(torso,0xe8b18f,[0,.76,0],[.28,.27,.28],.08);

// ========================================
// 자경이 양팔
// 각 팔은 끊김 없는 단일 형태
// 소매는 팔에 자연스럽게 이어지는 짧은 상의 부분
// ========================================
for(const side of [-1,1]){
  const arm=new THREE.Group();
  arm.position.set(side*.61,.35,0);
  torso.add(arm);

  // 팔 전체
  capsule(arm,0xe8b18f,[side*.04,-.48,0],.15,.78);

  // 소매: 팔 위쪽에 자연스럽게 겹치는 형태
  capsule(arm,0xf0eee5,[side*.025,-.06,0],.19,.30);

  // 손
  roundedBox(arm,0xe8b18f,[side*.04,-1.0,.02],[.25,.23,.23],.09);
}

// ========================================
// 일자 멜빵
// V자 연결 없음
// ========================================
const suspenders=new THREE.Group();
suspenders.position.set(0,0,-.318);
torso.add(suspenders);

for(const side of [-1,1]){
  roundedBox(
    suspenders,0x795338,
    [side*.28,.02,0],
    [.11,1.12,.055],.025
  );
}

// ========================================
// 머리
// 작고 둥근 형태, 얼굴 디테일 생략
// ========================================
const head=new THREE.Group();
head.position.set(0,1.03,0);
torso.add(head);

roundedBox(head,0xe8b18f,[0,0,0],[.92,1.02,.82],.31);

// 뒤통수 머리카락
roundedBox(head,0x211d20,[0,.16,-.14],[1.0,.79,.88],.29);
roundedBox(head,0x211d20,[0,.44,-.07],[.9,.32,.78],.16);

// 옆머리
roundedBox(head,0x211d20,[-.42,.1,.13],[.16,.5,.2],.07);
roundedBox(head,0x211d20,[.42,.1,.13],[.16,.5,.2],.07);

// 앞머리
roundedBox(head,0x211d20,[-.17,.4,.36],[.52,.2,.12],.05);
roundedBox(head,0x211d20,[.17,.34,.37],[.36,.15,.12],.05);

// 귀만 최소한으로 표현
for(const side of [-1,1]){
  sphere(head,0xe8b18f,[side*.47,-.04,0],[.18,.24,.17]);
}

// ========================================
// 책
// ========================================
const book=new THREE.Group();
book.position.set(.53,-.13,.33);
book.rotation.set(-.12,.12,-.15);
torso.add(book);

roundedBox(book,0x70432f,[0,0,0],[.4,.58,.11],.035);
roundedBox(book,0xe9d9b9,[0,0,.06],[.34,.52,.025],.02);
roundedBox(book,0x70432f,[-.12,0,.08],[.035,.5,.025],.01);

// ========================================
// 양쪽에서 들어오는 팔
// 화면 양옆에 고정된 시작점
// 팔 전체가 하나로 이어져 반원 궤도로 이동
// ========================================

// 덕형 왼팔
const leftRoot=new THREE.Group();
leftRoot.position.set(-2.05,2.65,3.65);
scene.add(leftRoot);

const leftLimb=makeLimb(0x59734e,.19);
leftRoot.add(leftLimb);

const leftHand=new THREE.Group();
leftRoot.add(leftHand);
sphere(leftHand,0xf1c19d,[0,0,0],[.42,.34,.34]);

// 한길 오른팔
const rightRoot=new THREE.Group();
rightRoot.position.set(2.05,2.65,3.65);
scene.add(rightRoot);

const rightLimb=makeLimb(0x84968b,.19);
rightRoot.add(rightLimb);

const rightHand=new THREE.Group();
rightRoot.add(rightHand);
sphere(rightHand,0xf1c19d,[0,0,0],[.42,.34,.34]);

// 팔의 반원 궤도
const armState={
  leftAngle:0,
  rightAngle:0,
  targetLeft:0,
  targetRight:0
};

function updateSideArm(root,limb,hand,side,angle){
  // 각도에 따라 끝점이 반원 형태로 움직임
  const reach=1.65;
  const drop=.65;

  const x=side*reach*Math.cos(angle);
  const y=-drop-reach*.48*Math.sin(angle);

  const end=[x,y,0];

  placeLimb(limb,[0,0,0],end);

  hand.position.set(...end);
}

// ========================================
// 아이템은 항상 화면 중앙
// ========================================
const holder=new THREE.Group();
holder.position.set(0,1.95,2.65);
scene.add(holder);

const itemNames=[
  '지갑','돈','담뱃갑','모자','라이터',
  '돌','벽돌','막대기','수배 전단지','옥수수'
];

const catchItems=new Set([
  '지갑','돈','담뱃갑','모자','라이터'
]);

let currentItem=null;
let currentName='';
let itemTimer=0;
let spawnTimer=0;
let score=0;
let time=60;
let active=false;
let combo=0;
let lastName='';
let repeat=0;
let dragging=false;
let startY=0;
let dragY=0;
let turning=false;
let turnProgress=0;
let shake=0;

function makeItem(name){
  const g=new THREE.Group();

  if(name==='지갑'){
    roundedBox(g,0x754a34,[0,0,0],[.65,.44,.14],.05);
    roundedBox(g,0x9a7354,[0,.02,.09],[.56,.07,.025],.02);
    sphere(g,0xd9b56c,[.2,0,.12],[.12,.16,.08]);
  }
  else if(name==='돈'){
    roundedBox(g,0xf5f0dc,[0,0,0],[.72,.45,.04],.025);
    roundedBox(g,0x304d76,[0,0,.03],[.62,.35,.015],.02);
    sphere(g,0xf5f0dc,[0,0,.05],[.24,.26,.04]);
  }
  else if(name==='담뱃갑'){
    roundedBox(g,0xe7e0cb,[0,0,0],[.42,.62,.22],.035);
    roundedBox(g,0xb43e37,[0,.2,.12],[.42,.2,.025],.015);
    roundedBox(g,0xeeeeea,[0,-.13,.12],[.42,.18,.025],.015);
  }
  else if(name==='모자'){
    const crown=new THREE.Mesh(
      new THREE.CylinderGeometry(.28,.35,.28,20),mat(0x284455)
    );
    crown.position.y=.08;
    g.add(crown);
    const brim=new THREE.Mesh(
      new THREE.CylinderGeometry(.48,.48,.07,24),mat(0x284455)
    );
    brim.position.set(0,-.08,.04);
    g.add(brim);
  }
  else if(name==='라이터'){
    roundedBox(g,0xb9c1c5,[0,0,0],[.3,.48,.2],.04);
    roundedBox(g,0x727b80,[.04,.26,0],[.17,.08,.22],.02);
    roundedBox(g,0xe1e5e7,[0,-.05,.105],[.22,.2,.012],.01);
  }
  else if(name==='돌'){
    const rock=new THREE.Mesh(
      new THREE.DodecahedronGeometry(.34),mat(0x747b79)
    );
    rock.scale.set(1.2,.9,1);
    g.add(rock);
  }
  else if(name==='벽돌'){
    roundedBox(g,0xa64e3d,[0,0,0],[.7,.4,.36],.04);
  }
  else if(name==='막대기'){
    capsule(g,0x79532f,[0,0,0],.09,.9,[0,0,Math.PI/2]);
  }
  else if(name==='옥수수'){
    capsule(g,0xe8c64e,[0,0,0],.18,.55,[0,0,Math.PI/2]);
    capsule(g,0x64864b,[-.23,-.12,0],.09,.4,[0,0,.5]);
    capsule(g,0x64864b,[.23,-.12,0],.09,.4,[0,0,-.5]);
  }
  else if(name==='수배 전단지'){
    roundedBox(g,0xf3e8d0,[0,0,0],[.72,.56,.04],.02);
    roundedBox(g,0xb34438,[0,.2,.03],[.58,.08,.02],.01);
    sphere(g,0xe1d3b8,[0,-.04,.045],[.25,.25,.025]);
    for(const x of [-.045,.045]){
      roundedBox(g,0x292522,[x,0,.065],[.025,.025,.012],.005);
    }
    roundedBox(g,0x292522,[0,-.045,.065],[.018,.045,.012],.005);
    roundedBox(g,0x292522,[0,-.09,.065],[.09,.018,.012],.005);
  }

  return g;
}

function nextName(){
  let n;
  do{
    n=itemNames[Math.floor(Math.random()*itemNames.length)];
  }while(n===lastName&&repeat>=2);

  if(n===lastName)repeat++;
  else{
    lastName=n;
    repeat=1;
  }
  return n;
}

function sound(freq,duration){
  try{
    const ctx=sound.ctx||(sound.ctx=new AudioContext());
    if(ctx.state==='suspended')ctx.resume();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type='triangle';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.start();
    osc.stop(ctx.currentTime+duration);
  }catch(e){}
}

function spawn(){
  currentName=nextName();
  currentItem=makeItem(currentName);
  holder.add(currentItem);
  itemTimer=0;

  // 덕형의 팔이 중앙으로 물건을 내밈
  armState.targetLeft=.8;
  sound(520,.08);
}

function clearItem(){
  if(currentItem){
    holder.remove(currentItem);
    currentItem=null;
  }
}

function finish(){
  if(!active)return;
  active=false;
  clearItem();
  turning=true;
  turnProgress=0;
  shake=.45;
  sound(110,.4);
  $('result').textContent=`훔친 물건 ${score}개`;
}

function judge(direction){
  if(!active||!currentItem)return;

  const isCatch=catchItems.has(currentName);
  const correct=(isCatch&&direction==='down')||
                (!isCatch&&direction==='up');

  if(!correct){
    finish();
    return;
  }

  if(isCatch){
    score++;
    $('score').textContent=score;
    sound(780,.1);
  }else{
    sound(250,.1);
  }

  combo++;
  if(combo%5===0)sound(1000,.18);

  clearItem();
  armState.targetLeft=0;
  armState.targetRight=0;
  spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// ========================================
// 터치 조작
// 오른쪽 팔과 손이 플레이어 조작에 반응
// ========================================
renderer.domElement.addEventListener('pointerdown',e=>{
  if(!active||!currentItem)return;
  dragging=true;
  startY=e.clientY;
  dragY=0;
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;

  dragY=e.clientY-startY;

  const v=THREE.MathUtils.clamp(dragY/150,-1,1);

  // 한길의 팔이 중앙 쪽으로 반응
  armState.targetRight=v*.85;
});

window.addEventListener('pointerup',()=>{
  if(!dragging)return;
  dragging=false;

  if(Math.abs(dragY)>15){
    judge(dragY>0?'down':'up');
  }

  armState.targetRight=0;
});

// ========================================
// 시작
// ========================================
function startGame(){
  active=true;
  time=60;
  score=0;
  combo=0;
  spawnTimer=.3;
  lastName='';
  repeat=0;
  turning=false;
  turnProgress=0;

  victim.rotation.y=Math.PI;
  angryReset();

  armState.leftAngle=0;
  armState.rightAngle=0;
  armState.targetLeft=0;
  armState.targetRight=0;

  clearItem();

  $('time').textContent=60;
  $('score').textContent=0;
  $('start').classList.add('hidden');
  $('end').classList.add('hidden');
  $('hint').classList.remove('hidden');
}

function angryReset(){}

$('startBtn').onclick=startGame;
$('again').onclick=startGame;

// ========================================
// 애니메이션
// ========================================
let last=performance.now();

function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min((now-last)/1000,.05);
  last=now;

  if(active){
    time-=dt;
    $('time').textContent=Math.max(0,Math.ceil(time));

    if(time<=0)finish();

    if(active&&!currentItem){
      spawnTimer-=dt;
      if(spawnTimer<=0)spawn();
    }
    else if(active&&currentItem){
      itemTimer+=dt;
      currentItem.rotation.y=Math.sin(now*.002)*.04;
      if(itemTimer>=3)finish();
    }
  }

  // 양쪽 팔은 고정된 어깨에서 반원 궤도로 이동
  armState.leftAngle+=(armState.targetLeft-armState.leftAngle)*Math.min(1,dt*9);
  armState.rightAngle+=(armState.targetRight-armState.rightAngle)*Math.min(1,dt*9);

  updateSideArm(leftRoot,leftLimb,leftHand,-1,armState.leftAngle);
  updateSideArm(rightRoot,rightLimb,rightHand,1,armState.rightAngle);

  // 게임오버 시 자경이가 회전
  if(turning){
    turnProgress=Math.min(1,turnProgress+dt*1.8);
    const eased=1-Math.pow(1-turnProgress,3);
    victim.rotation.y=Math.PI*(1-eased);

    if(turnProgress>=1){
      turning=false;
      $('end').classList.remove('hidden');
      $('hint').classList.add('hidden');
    }
  }

  if(shake>0){
    shake=Math.max(0,shake-dt);
    camera.position.x=(Math.random()-.5)*shake*.1;
  }else{
    camera.position.x=0;
  }

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
