
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#9bd6f4;
 font-family:Arial,"Noto Sans KR",sans-serif
}
#game{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}

.hud{
 position:fixed;top:12px;left:12px;right:12px;z-index:3;
 display:flex;justify-content:space-between;pointer-events:none
}
.logo,.stat{
 background:#263e50ed;color:white;border-radius:15px;
 padding:10px 13px;box-shadow:0 4px 12px #263b3530
}
.logo{font-size:17px;font-weight:900}
.stats{display:flex;gap:6px}
.stat{text-align:center;min-width:60px}
.stat small{display:block;font-size:10px;color:#e4e8e9}
.stat strong{font-size:22px}

#itemPanel{
 position:fixed;top:82px;left:50%;transform:translateX(-50%);
 z-index:3;width:min(330px,85%);
 background:#fff7e9;border:2px solid white;border-radius:18px;
 padding:10px 16px;display:flex;align-items:center;gap:13px;
 box-shadow:0 4px 0 #d7c5a8,0 8px 18px #263b3530;
 color:#293b46;pointer-events:none
}
#itemPanel .itemIcon{
 width:42px;height:42px;display:grid;place-items:center;
 background:#e9e3d7;border-radius:12px;font-size:25px
}
#itemPanel small{display:block;color:#98785c;font-size:11px;font-weight:900}
#itemPanel strong{font-size:19px}
#itemPanel.hidden{display:none}

#hint{
 position:fixed;bottom:22px;left:0;right:0;z-index:3;
 color:white;text-align:center;font-weight:900;font-size:13px;
 text-shadow:0 2px 5px #263b35;pointer-events:none
}
#hint.hidden{display:none}

.overlay{
 position:fixed;inset:0;z-index:6;display:grid;
 place-items:center;background:#142c3b70;padding:18px
}
.panel{
 width:min(390px,100%);background:#fff7e9;color:#293b46;
 border:2px solid white;border-radius:24px;padding:25px 22px;
 text-align:center;box-shadow:0 12px 35px #142c3b66
}
.panel h1{font-size:30px;margin:0 0 12px}
.panel p{line-height:1.7}
.intro{font-size:34px;font-weight:1000;line-height:1.25;color:#bd6747;margin:15px 0}
.intro-sub{font-size:15px;font-weight:800;line-height:1.8}
.intro-small{font-size:13px;color:#827360;line-height:1.7;margin:15px 0}
.preview{background:#e8edf0;border-radius:14px;padding:12px;font-weight:900;margin:14px 0}
.scoreResult{background:#e8edf0;border-radius:15px;padding:16px;margin:18px 0;font-weight:800}
.scoreResult strong{display:block;font-size:36px;color:#bd6747;margin-top:5px}
button{
 border:0;border-radius:14px;background:#d96d50;color:white;
 padding:14px 28px;font-size:17px;font-weight:900;
 box-shadow:0 4px 0 #a94d39
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a94d39}
.hidden{display:none!important}

#end{
 display:flex;align-items:flex-end;padding:0 12px 18px;
 background:linear-gradient(transparent,#142c3b55)
}
#end .panel{
 border-radius:25px;padding:25px 22px 22px;
 animation:rise .35s ease-out
}
#end .speech{
 display:inline-block;background:#e8edf0;color:#293b46;
 border-radius:18px;padding:10px 15px;font-weight:900;margin-bottom:12px
}
@keyframes rise{
 from{transform:translateY(100%);opacity:.5}
 to{transform:translateY(0);opacity:1}
}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="logo">환상의 짝꿍</div>
 <div class="stats">
  <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
  <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
 </div>
</div>

<div id="itemPanel" class="hidden">
 <div class="itemIcon" id="itemIcon">👛</div>
 <div>
  <small>이번 물건</small>
  <strong id="itemName">지갑</strong>
 </div>
</div>

<div id="hint" class="hidden">↓ 아래로 드래그: 받기　/　↑ 위로 드래그: 쳐내기</div>

<div class="overlay" id="start">
 <div class="panel">
  <h1>환상의 짝꿍</h1>
  <div class="preview">덕형과 한길의 비밀 작전</div>
  <div class="intro">나는 최고의<br>소매치기!</div>
  <div class="intro-sub">
   쥐도 새도 모르게 지갑만 쏙!<br>
   여유로운 행인의 주머니를 털어라!
  </div>
  <p class="intro-small">
   아래로 드래그하면 받고,<br>
   위로 드래그하면 위험한 물건을 쳐낼 수 있어요.
  </p>
  <button id="startBtn">작전 시작</button>
 </div>
</div>

<div class="overlay hidden" id="end">
 <div class="panel">
  <div class="speech">지금 뭐 하시는 거예요!</div>
  <h1>작전 발각!</h1>
  <p>자경이에게 들켰습니다.</p>
  <div class="scoreResult">
   훔친 물건
   <strong id="result">0개</strong>
  </div>
  <button id="again">다시 도전하기</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=id=>document.getElementById(id);

// =====================================
// 장면과 카메라
// =====================================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd6f4);
scene.fog=new THREE.Fog(0x9bd6f4,28,65);

const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.8,8);
camera.lookAt(0,1.85,.2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));

const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// =====================================
// 도형 도우미
// =====================================
function material(color,roughness=.84){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function rounded(parent,color,pos,size,radius=.08){
 const m=new THREE.Mesh(
  new RoundedBoxGeometry(size[0],size[1],size[2],5,radius),
  material(color)
 );
 m.position.set(...pos);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function sphere(parent,color,pos,scale){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(.5,28,20),
  material(color)
 );
 m.position.set(...pos);
 m.scale.set(...scale);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function capsule(parent,color,pos,radius,length,rotation=[0,0,0]){
 const m=new THREE.Mesh(
  new THREE.CapsuleGeometry(radius,length,6,18),
  material(color)
 );
 m.position.set(...pos);
 m.rotation.set(...rotation);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function connect(mesh,a,b){
 const A=new THREE.Vector3(...a);
 const B=new THREE.Vector3(...b);
 const d=B.clone().sub(A);
 mesh.position.copy(A).add(B).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),d.clone().normalize()
 );
 mesh.scale.set(1,d.length(),1);
}

// 둥근 직사각형 소매
function sleeveSegment(parent,color){
 return rounded(parent,color,[0,0,0],[.72,1,.58],.16);
}

function positionSleeve(mesh,a,b){
 const A=new THREE.Vector3(...a);
 const B=new THREE.Vector3(...b);
 const d=B.clone().sub(A);
 mesh.position.copy(A).add(B).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),d.clone().normalize()
 );
 mesh.scale.set(1,d.length(),1);
}

// =====================================
// 시골길 배경
// =====================================
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),material(0x91b879)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
scene.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(7,65),material(0xc9a77c)
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.07,-12);
scene.add(road);

for(let i=0;i<55;i++){
 const s=.035+Math.random()*.09;
 const stone=new THREE.Mesh(
  new THREE.DodecahedronGeometry(s),
  material(0xb5a087)
 );
 stone.position.set((Math.random()-.5)*5.8,-.015,-30+Math.random()*35);
 stone.scale.set(1.5,.4,1);
 scene.add(stone);
}

for(const side of [-1,1]){
 for(let i=0;i<10;i++){
  rounded(scene,0x806044,[side*5.2,.55,-27+i*3],[.16,1.1,.16],.04);
 }
 for(const y of [.45,.85]){
  rounded(scene,0x9a7955,[side*5.2,y,-13],[.13,.13,30],.04);
 }
}

for(let i=0;i<12;i++){
 const h=2+Math.random()*3;
 sphere(scene,0x83ad78,[-22+i*4,h*.25,-27],[7,h*2,4]);
}

for(let i=0;i<8;i++){
 const cloud=new THREE.Group();
 sphere(cloud,0xfff9ed,[0,0,0],[3,.9,1.4]);
 sphere(cloud,0xfff9ed,[-.8,-.1,.05],[1.7,.8,1.2]);
 sphere(cloud,0xfff9ed,[.85,-.1,0],[1.8,.9,1.2]);
 cloud.position.set(-14+i*4,9+(i%3),-20);
 scene.add(cloud);
}

// =====================================
// 자경이
// 화면 바닥에 붙도록 아래로 배치
// =====================================
const victim=new THREE.Group();
scene.add(victim);

// 기존보다 아래로 내리고 크게 배치
victim.position.set(0,-1.45,.1);
victim.scale.setScalar(1.72);

const torso=new THREE.Group();
torso.position.set(0,.85,0);
victim.add(torso);

// 긴 셔츠 몸통
rounded(torso,0xf0eee5,[0,0,0],[1.15,1.35,.64],.17);

// 어깨
for(const side of [-1,1]){
 sphere(torso,0xf0eee5,[side*.61,.35,0],[.34,.38,.32]);

 // 자경이의 긴 소매
 rounded(
  torso,0xf0eee5,
  [side*.69,-.18,0],
  [.38,.9,.58],.14
 );

 // 손
 sphere(torso,0xe8b18f,[side*.69,-.67,.02],[.16,.16,.16]);
}

// 목
capsule(torso,0xe8b18f,[0,.78,0],.17,.22);

// 앞 멜빵
for(const side of [-1,1]){
 rounded(torso,0x795338,[side*.3,-.02,.33],[.11,1.15,.05],.025);
}

// 머리
const head=new THREE.Group();
head.position.set(0,1.0,0);
torso.add(head);

sphere(head,0xe8b18f,[0,0,0],[.92,.95,.83]);

// 머리카락은 하나의 큰 실루엣으로 연결
const hair=sphere(head,0x211d20,[0,.2,-.06],[.98,.68,.89]);
hair.rotation.z=-.08;

// 앞쪽 사선 머리 형태
const hairFront=sphere(head,0x211d20,[0,.35,.15],[.88,.37,.69]);
hairFront.rotation.z=-.22;

// 귀
for(const side of [-1,1]){
 sphere(head,0xe8b18f,[side*.47,-.02,.03],[.15,.2,.14]);
}

// 안경
const glasses=new THREE.Group();
head.add(glasses);

for(const side of [-1,1]){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.17,.025,8,24),
  material(0x242424)
 );
 ring.position.set(side*.2,.04,.46);
 glasses.add(ring);
}
rounded(glasses,0x242424,[0,.04,.47],[.1,.035,.025],.01);

// 화난 눈썹
const brows=new THREE.Group();
head.add(brows);

for(const side of [-1,1]){
 const brow=rounded(
  brows,0x241d19,
  [side*.2,.28,.49],
  [.22,.05,.035],.015
 );
 brow.rotation.z=side<0?-.32:.32;
}
brows.visible=false;

// =====================================
// 덕형 왼팔: 와이퍼처럼 내려오는 팔
// 한길 오른팔: 중앙에서 대기하는 팔
// =====================================
function createArm(color,side){
 const group=new THREE.Group();
 scene.add(group);

 const upper=sleeveSegment(group,color);
 const lower=sleeveSegment(group,color);

 // 소매 끝 부분
 const cuff=sphere(group,color,[0,0,0],[.38,.18,.32]);

 // 손바닥은 기존보다 크게
 const hand=new THREE.Group();
 group.add(hand);
 sphere(hand,0xf0bd9b,[0,0,0],[.62,.52,.5]);

 return {group,upper,lower,cuff,hand,side};
}

const leftArm=createArm(0x647d58,-1);
const rightArm=createArm(0x83998b,1);

// 팔의 위치를 매 프레임 갱신
function updateArm(arm,shoulder,elbow,wrist){
 positionSleeve(arm.upper,shoulder,elbow);
 positionSleeve(arm.lower,elbow,wrist);

 arm.cuff.position.set(...wrist);
 arm.hand.position.set(
  wrist[0],wrist[1]-.22,wrist[2]+.05
 );
}

// =====================================
// 아이템
// =====================================
const itemHolder=new THREE.Group();
scene.add(itemHolder);

const itemNames=[
 '지갑','돈','담뱃갑','모자','라이터',
 '돌','벽돌','나뭇가지','수배 전단지','옥수수'
];

const catchItems=new Set(['지갑','돈','담뱃갑','모자','라이터']);

const itemIcons={
 '지갑':'👛','돈':'💵','담뱃갑':'🚬','모자':'🧢',
 '라이터':'▰','돌':'🪨','벽돌':'🧱',
 '나뭇가지':'🌿','수배 전단지':'📄','옥수수':'🌽'
};

let currentItem=null;
let currentName='';
let itemTimer=0;
let spawnTimer=0;
let score=0;
let time=60;
let active=false;
let combo=0;
let lastName='';
let repeat=0;
let dragging=false;
let startY=0;
let dragY=0;
let turning=false;
let turnProgress=0;
let shake=0;
let handMove=0;

// 덕형 손의 와이퍼 애니메이션 상태
let leftSweep=0;
let leftSweepReady=false;
let itemAttached=true;

function makeItem(name){
 const g=new THREE.Group();

 if(name==='지갑'){
  rounded(g,0x754a34,[0,0,0],[.56,.38,.12],.045);
  rounded(g,0x9a7354,[0,.02,.07],[.48,.06,.02],.015);
  sphere(g,0xd9b56c,[.17,0,.09],[.1,.12,.06]);
 }else if(name==='돈'){
  rounded(g,0xf5f0dc,[0,0,0],[.62,.4,.035],.02);
  rounded(g,0x304d76,[0,0,.025],[.54,.32,.012],.015);
  sphere(g,0xf5f0dc,[0,0,.04],[.18,.2,.02]);
 }else if(name==='담뱃갑'){
  rounded(g,0xe7e0cb,[0,0,0],[.37,.54,.18],.03);
  rounded(g,0xb43e37,[0,.17,.1],[.37,.17,.02],.01);
  rounded(g,0xeeeeea,[0,-.12,.1],[.37,.16,.02],.01);
 }else if(name==='모자'){
  const crown=new THREE.Mesh(
   new THREE.CylinderGeometry(.24,.3,.25,24),
   material(0x284455)
  );
  crown.position.y=.06;
  g.add(crown);

  const brim=new THREE.Mesh(
   new THREE.CylinderGeometry(.42,.42,.06,24),
   material(0x284455)
  );
  brim.position.y=-.09;
  g.add(brim);
 }else if(name==='라이터'){
  rounded(g,0xb9c1c5,[0,0,0],[.27,.42,.17],.035);
  rounded(g,0x727b80,[.03,.23,0],[.15,.07,.18],.015);
 }else if(name==='돌'){
  const rock=new THREE.Mesh(
   new THREE.DodecahedronGeometry(.3),
   material(0x747b79)
  );
  rock.scale.set(1.2,.9,1);
  g.add(rock);
 }else if(name==='벽돌'){
  rounded(g,0xa64e3d,[0,0,0],[.62,.35,.3],.035);
 }else if(name==='나뭇가지'){
  capsule(g,0x79532f,[0,0,0],.055,.72,[0,0,Math.PI/2]);
  capsule(g,0x79532f,[.17,.1,0],.04,.28,[0,0,.7]);
  capsule(g,0x79532f,[-.18,-.08,0],.04,.25,[0,0,-.7]);
 }else if(name==='옥수수'){
  // 길쭉한 노란 옥수수와 작은 초록 잎 두 장
  sphere(g,0xe9c442,[0,0,0],[.20,.62,.19]);
  capsule(g,0x4f8745,[-.11,-.34,.02],.075,.24,[0,0,-.45]);
  capsule(g,0x65974b,[.11,-.34,.02],.075,.24,[0,0,.45]);
 }else if(name==='수배 전단지'){
  rounded(g,0xf3e8d0,[0,0,0],[.62,.48,.035],.015);

  const outline=new THREE.Mesh(
   new THREE.TorusGeometry(.13,.012,6,24),
   material(0x302c29)
  );
  outline.position.set(0,-.015,.035);
  g.add(outline);

  for(const x of [-.05,.05]){
   sphere(g,0x302c29,[x,.015,.05],[.025,.025,.012]);
  }

  // 코 없이 W자 입
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute([
   -.105,-.065,.055,
   -.052,-.105,.055,
   0,-.065,.055,
   .052,-.105,.055,
   .105,-.065,.055
  ],3));
  g.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x302c29})));

  for(let i=0;i<2;i++){
   rounded(g,0x49423b,[0,-.19-i*.035,.03],[.34-i*.05,.012,.01],.004);
  }
 }
 return g;
}

function nextName(){
 let n;
 do{
  n=itemNames[Math.floor(Math.random()*itemNames.length)];
 }while(n===lastName&&repeat>=2);

 if(n===lastName)repeat++;
 else{lastName=n;repeat=1}
 return n;
}

function sound(freq,duration){
 try{
  const ctx=sound.ctx||(sound.ctx=new AudioContext());
  if(ctx.state==='suspended')ctx.resume();

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type='triangle';
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.08,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.start();
  osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

// =====================================
// 물건 등장
// =====================================
function spawn(){
 currentName=nextName();
 currentItem=makeItem(currentName);
 itemHolder.add(currentItem);
 itemTimer=0;

 // 매번 왼손이 위쪽에서 출발
 leftSweep=0;
 leftSweepReady=false;
 itemAttached=true;

 $('itemName').textContent=currentName;
 $('itemIcon').textContent=itemIcons[currentName]||'📦';
 $('itemPanel').classList.remove('hidden');

 sound(520,.08);
}

function clearItem(){
 if(currentItem){
  itemHolder.remove(currentItem);
  currentItem=null;
 }
 $('itemPanel').classList.add('hidden');
 leftSweep=0;
 leftSweepReady=false;
 itemAttached=false;
}

function finish(){
 if(!active)return;
 active=false;
 clearItem();
 $('hint').classList.add('hidden');
 turning=true;
 turnProgress=0;
 shake=.4;
 sound(110,.4);
}

function judge(direction){
 if(!active||!currentItem)return;

 const isCatch=catchItems.has(currentName);
 const correct=(isCatch&&direction==='down')||
               (!isCatch&&direction==='up');

 if(!correct){
  finish();
  return;
 }

 if(isCatch){
  score++;
  $('score').textContent=score;
  sound(780,.1);
 }else{
  sound(250,.1);
 }

 combo++;
 if(combo%5===0)sound(1000,.18);

 clearItem();
 spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// =====================================
// 터치 조작
// =====================================
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!active||!currentItem)return;
 dragging=true;
 startY=e.clientY;
 dragY=0;
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 dragY=e.clientY-startY;
 handMove=THREE.MathUtils.clamp(dragY/180,-.6,.6);
});

window.addEventListener('pointerup',()=>{
 if(!dragging)return;
 dragging=false;

 if(Math.abs(dragY)>15){
  judge(dragY>0?'down':'up');
 }
 handMove=0;
});

// =====================================
// 시작 / 재시작
// =====================================
function startGame(){
 active=true;
 time=60;
 score=0;
 combo=0;
 spawnTimer=.3;
 lastName='';
 repeat=0;
 turning=false;
 turnProgress=0;
 shake=0;
 handMove=0;
 dragging=false;
 leftSweep=0;
 leftSweepReady=false;

 victim.rotation.y=Math.PI;
 brows.visible=false;

 clearItem();

 $('time').textContent='60';
 $('score').textContent='0';
 $('start').classList.add('hidden');
 $('end').classList.add('hidden');
 $('hint').classList.remove('hidden');
}

$('startBtn').onclick=startGame;
$('again').onclick=startGame;

// =====================================
// 애니메이션
// =====================================
let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(active){
  time-=dt;
  $('time').textContent=Math.max(0,Math.ceil(time));

  if(time<=0)finish();

  if(active&&!currentItem){
   spawnTimer-=dt;
   if(spawnTimer<=0)spawn();
  }

  if(active&&currentItem){
   itemTimer+=dt;
   currentItem.rotation.y=Math.sin(now*.002)*.025;

   if(itemTimer>=3)finish();
  }
 }

 // ---------------------------------
 // 덕형 왼팔 와이퍼 모션
 // 위쪽 바깥에서 중앙 아래로 내려옴
 // ---------------------------------
 let leftShoulder=[-2.5,4.0,3.6];
 let leftElbow=[-1.65,3.05,3.8];
 let leftWrist=[-.95,2.65,3.9];

 if(currentItem&&active){
  leftSweep=Math.min(1,leftSweep+dt*1.7);
  const eased=leftSweep*leftSweep*(3-2*leftSweep);

  // 시작은 왼쪽 위, 도착은 화면 중앙
  leftElbow=[
   THREE.MathUtils.lerp(-1.65,-.95,eased),
   THREE.MathUtils.lerp(3.05,2.35,eased),
   3.8
  ];

  leftWrist=[
   THREE.MathUtils.lerp(-.95,-.15,eased),
   THREE.MathUtils.lerp(2.65,1.75,eased),
   3.95
  ];

  if(leftSweep>=1)leftSweepReady=true;

  // 손에 들린 물건은 손과 함께 움직임
  if(itemAttached){
   itemHolder.position.set(
    leftWrist[0]+.12,
    leftWrist[1]-.05,
    leftWrist[2]+.12
   );
  }
 }else{
  // 대기 상태의 팔도 화면 왼쪽에서 보이게 유지
  leftElbow=[-1.55,3.0,3.8];
  leftWrist=[-.55,2.05,3.9];
 }

 updateArm(leftArm,leftShoulder,leftElbow,leftWrist);

 // ---------------------------------
 // 한길 오른팔: 오른쪽 위에서 중앙으로
 // ---------------------------------
 const rightShoulder=[2.5,4.0,3.6];
 const rightElbow=[
  THREE.MathUtils.lerp(1.7,1.0,Math.abs(handMove)),
  3.05+handMove*.2,
  3.8
 ];
 const rightWrist=[
  .55,
  1.85+handMove,
  3.95
 ];
 updateArm(rightArm,rightShoulder,rightElbow,rightWrist);

 // 게임오버 회전
 if(turning){
  turnProgress=Math.min(1,turnProgress+dt*1.8);
  const eased=1-Math.pow(1-turnProgress,3);
  victim.rotation.y=Math.PI*(1-eased);
  brows.visible=true;

  if(turnProgress>=1){
   turning=false;
   victim.rotation.y=0;
   $('result').textContent=score+'개';
   $('end').classList.remove('hidden');
  }
 }

 if(shake>0){
  shake=Math.max(0,shake-dt);
  camera.position.x=(Math.random()-.5)*shake*.1;
 }else{
  camera.position.x=0;
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
