
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8cccf0;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.logo,.stat{background:#293c36e8;color:white;border-radius:14px;padding:9px 12px;box-shadow:0 3px 12px #263b3540}
.logo{font-weight:900;font-size:17px}
.stats{display:flex;gap:6px}
.stat{text-align:center;min-width:58px}
.stat small{display:block;font-size:9px;letter-spacing:1px;color:#d9e8dd}
.stat strong{font-size:21px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#172b2966;padding:20px;z-index:5}
.panel{width:min(390px,100%);background:#fff8e9;color:#293a32;border-radius:24px;padding:26px;text-align:center;box-shadow:0 15px 45px #243b3c66}
.panel h1{font-size:clamp(27px,7vw,38px);margin:0 0 12px}
.panel p{line-height:1.7}
.panel .result{font-size:25px;font-weight:900;margin:20px 0}
button{background:#e9a64c;color:#34271c;border:0;border-radius:14px;padding:14px 32px;font-size:17px;font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="logo">환상의 짝꿍</div>
  <div class="stats">
    <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
    <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
  </div>
</div>

<div class="overlay" id="start">
  <div class="panel">
    <h1>환상의 짝꿍</h1>
    <p>덕형과 한길의 비밀 작전!<br>자경에게 들키지 않고 물건을 훔쳐라!</p>
    <button id="startBtn">작전 시작</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <h1>지금 뭐 하시는 거예요?</h1>
    <p>자경이에게 들켰습니다!</p>
    <div class="result" id="result">훔친 물건 0개</div>
    <button id="again">다시 도전하기</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d0f4);
scene.fog=new THREE.Fog(0x91d0f4,22,55);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.2,8.7);
camera.lookAt(0,2.3,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$('game').appendChild(renderer.domElement);

// 조명
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));
const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// 재질과 도형
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function mesh(p,g,c,pos,scale=[1,1,1]){
  const m=new THREE.Mesh(g,mat(c));
  m.position.set(...pos);
  m.scale.set(...scale);
  m.castShadow=true;
  m.receiveShadow=true;
  p.add(m);
  return m;
}
function ball(p,c,pos,scale=[1,1,1],r=.5){
  return mesh(p,new THREE.SphereGeometry(r,20,16),c,pos,scale);
}
function capsule(p,c,pos,r=.2,len=.5,rot=[0,0,0]){
  const m=mesh(p,new THREE.CapsuleGeometry(r,len,5,12),c,pos);
  m.rotation.set(...rot);
  return m;
}
function box(p,c,pos,size,rot=[0,0,0]){
  const m=mesh(p,new THREE.BoxGeometry(...size),c,pos);
  m.rotation.set(...rot);
  return m;
}

// 시골 비포장도로 배경
const ground=mesh(scene,new THREE.PlaneGeometry(100,100),0x8da96b,[0,-.15,-5]);
ground.rotation.x=-Math.PI/2;

// 흙길
const road=mesh(scene,new THREE.PlaneGeometry(7,65),0xb9956d,[0,-.08,-12]);
road.rotation.x=-Math.PI/2;
road.position.y=-.07;

// 길 위 자갈
for(let i=0;i<65;i++){
  const x=(Math.random()-.5)*5.8;
  const z=-30+Math.random()*35;
  const size=.035+Math.random()*.1;
  ball(scene,Math.random()>.5?0x8d806c:0xb7a18a,[x,-.015,z],[size*1.5,size*.4,size],size);
}

// 길가 풀과 꽃
for(let i=0;i<70;i++){
  const side=Math.random()>.5?1:-1;
  const x=side*(4+Math.random()*7);
  const z=-28+Math.random()*35;
  capsule(scene,0x547b45,[x,.22,z],.035,.35,[0,0,(Math.random()-.5)*.8]);
  if(i%5===0)ball(scene,0xe8d99b,[x,.45,z],[.08,.08,.08],.08);
}

// 울타리
for(const side of [-1,1]){
  for(let i=0;i<10;i++){
    const z=-27+i*3;
    const x=side*5.2;
    box(scene,0x806044,[x,.55,z],[.16,1.1,.16]);
  }
  for(const y of [.45,.85]){
    box(scene,0x9a7955,[side*5.2,y,-13],[.13,.13,30]);
  }
}

// 멀리 언덕
for(let i=0;i<12;i++){
  const h=2+Math.random()*3;
  ball(scene,0x739a70,[-22+i*4,h*.25,-27],[3.5,h,2],1);
}

// 구름
for(let i=0;i<8;i++){
  const g=new THREE.Group();
  ball(g,0xfaf8ed,[0,0,0],[1.5,.55,.7]);
  ball(g,0xfaf8ed,[-.8,-.1,.05],[.85,.42,.6]);
  ball(g,0xfaf8ed,[.85,-.1,0],[.9,.45,.6]);
  g.position.set(-14+i*4,9+(i%3),-20);
  scene.add(g);
}

// 자경이 캐릭터
const victim=new THREE.Group();
scene.add(victim);
victim.position.set(0,0,-.6);

const torso=new THREE.Group();
torso.position.y=1.45;
victim.add(torso);

// 몸통과 셔츠
ball(torso,0xf0eee5,[0,0,0],[.78,1.05,.43],.7);

// 목
capsule(torso,0xe9b18d,[0,.98,0],.18,.24);

// 어깨와 팔
const shoulderL=ball(torso,0xf0eee5,[-.67,.55,0],[.3,.36,.35]);
const shoulderR=ball(torso,0xf0eee5,[.67,.55,0],[.3,.36,.35]);
capsule(torso,0xf0eee5,[-.82,.03,0],.19,.55,[0,0,.1]);
capsule(torso,0xf0eee5,[.82,.03,0],.19,.55,[0,0,-.1]);

// 멜빵
capsule(torso,0x795338,[-.39,.05,.38],.075,.85,[0,0,-.1]);
capsule(torso,0x795338,[.39,.05,.38],.075,.85,[0,0,.1]);
box(torso,0x96704c,[0,-.34,.4],[.18,.12,.04]);

// 바지와 다리
const legs=new THREE.Group();
legs.position.y=.45;
victim.add(legs);
capsule(legs,0x554536,[-.3,-.35,0],.2,.95);
capsule(legs,0x554536,[.3,-.35,0],.2,.95);
ball(legs,0x40362e,[-.3,-.91,.12],[.25,.14,.4]);
ball(legs,0x40362e,[.3,-.91,.12],[.25,.14,.4]);

// 머리
const head=new THREE.Group();
head.position.set(0,1.25,0);
torso.add(head);
ball(head,0xe8b38d,[0,0,0],[.62,.73,.56],.65);

// 머리카락
ball(head,0x17191a,[0,.25,-.09],[.65,.55,.59],.65);
ball(head,0x17191a,[0,.47,.04],[.57,.25,.5],.55);
ball(head,0x17191a,[-.3,.28,.17],[.23,.32,.28],.3);
ball(head,0x17191a,[.3,.28,.17],[.23,.32,.28],.3);

// 귀
ball(head,0xe8b38d,[-.61,0,0],[.14,.19,.13],.2);
ball(head,0xe8b38d,[.61,0,0],[.14,.19,.13],.2);

// 안경과 눈
const glasses=new THREE.Group();
head.add(glasses);
for(const x of [-.22,.22]){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.17,.025,8,20),
    mat(0x242525)
  );
  ring.position.set(x,.03,.53);
  glasses.add(ring);
  ball(head,0x25201c,[x,.02,.53],[.035,.05,.025],.08);
}
box(glasses,0x242525,[0,.03,.55],[.12,.035,.035]);

// 화난 눈썹
const angry=new THREE.Group();
head.add(angry);
for(const x of [-.22,.22]){
  box(angry,0x241d19,[x,.21,.56],[.23,.055,.04],[0,0,x<0?-.35:.35]);
}
angry.visible=false;

// 자경이의 책
const book=new THREE.Group();
book.position.set(.66,.05,.15);
torso.add(book);
box(book,0x70432f,[0,0,0],[.48,.65,.14]);
box(book,0xe9d9b9,[0,0,.08],[.42,.58,.035]);
box(book,0x70432f,[0,0,.105],[.06,.57,.025]);

// 덕형의 왼쪽 팔
const leftArm=new THREE.Group();
leftArm.position.set(-2.2,.9,2);
scene.add(leftArm);
capsule(leftArm,0x59734e,[0,.48,0],.28,.85,[0,0,-.5]);
capsule(leftArm,0x59734e,[.35,-.05,0],.23,.65,[0,0,.8]);

// 덕형의 손
const leftHand=new THREE.Group();
leftHand.position.set(.7,-.27,.05);
leftArm.add(leftHand);
ball(leftHand,0xf1c19d,[0,0,0],[.25,.19,.18],.35);
for(let i=0;i<4;i++){
  capsule(leftHand,0xf1c19d,[.19,-.12+i*.08,.02],.055,.13,[0,0,-.4]);
}

// 한길의 오른쪽 팔
const rightArm=new THREE.Group();
rightArm.position.set(2.1,.3,2.5);
scene.add(rightArm);
capsule(rightArm,0x84968b,[0,.35,0],.3,1.05,[0,0,.35]);
capsule(rightArm,0x84968b,[-.35,-.28,0],.24,.65,[0,0,-.8]);

// 오른손만 움직이는 구조
const hand=new THREE.Group();
rightArm.add(hand);
const handBaseY=-.72;
hand.position.set(-.63,handBaseY,.15);
ball(hand,0xf1c19d,[0,0,0],[.3,.22,.17],.4);
for(let i=0;i<4;i++){
  capsule(hand,0xf1c19d,[-.18,-.14+i*.09,.02],.06,.18,[0,0,-.3]);
}
capsule(hand,0xf1c19d,[.17,-.16,.05],.065,.18,[0,0,.7]);

// 아이템
const holder=new THREE.Group();
holder.position.set(-1.45,1.25,2.5);
scene.add(holder);

const itemNames=['지갑','돈','담뱃갑','모자','라이터','돌','벽돌','막대기','수배 전단지','옥수수','신문'];
const catchItems=new Set(['지갑','돈','담뱃갑','모자','라이터']);
let currentItem=null,currentName='';
let itemTimer=0,spawnTimer=0;
let score=0,time=60,active=false,combo=0;
let lastName='',repeat=0;
let dragging=false,startY=0,dragY=0;
let turning=false,turnProgress=0,shake=0;

function makeItem(name){
  const g=new THREE.Group();

  if(name==='지갑'){
    box(g,0x754a34,[0,0,0],[.65,.44,.14]);
    box(g,0x9a7354,[0,.02,.09],[.56,.07,.025]);
    ball(g,0xd9b56c,[.2,0,.12],[.06,.08,.04]);
  }
  else if(name==='돈'){
    box(g,0xf5f0dc,[0,0,0],[.72,.45,.04]);
    box(g,0x304d76,[0,0,.03],[.62,.35,.015]);
    ball(g,0xf5f0dc,[0,0,.05],[.12,.13,.02]);
  }
  else if(name==='담뱃갑'){
    box(g,0xe7e0cb,[0,0,0],[.42,.62,.22]);
    box(g,0xb43e37,[0,.2,.12],[.42,.2,.025]);
    box(g,0xeeeeea,[0,-.13,.12],[.42,.18,.025]);
  }
  else if(name==='모자'){
    mesh(g,new THREE.CylinderGeometry(.28,.35,.28,20),0x284455,[0,.08,0]);
    mesh(g,new THREE.CylinderGeometry(.48,.48,.07,24),0x284455,[0,-.08,.04]);
  }
  else if(name==='라이터'){
    box(g,0xd9aa39,[0,0,0],[.3,.48,.2]);
    box(g,0x424746,[.04,.26,0],[.17,.08,.22]);
  }
  else if(name==='돌'){
    mesh(g,new THREE.DodecahedronGeometry(.34),0x747b79,[0,0,0],[1.2,.9,1]);
  }
  else if(name==='벽돌'){
    box(g,0xa64e3d,[0,0,0],[.7,.4,.36]);
  }
  else if(name==='막대기'){
    capsule(g,0x79532f,[0,0,0],.09,.9,[0,0,Math.PI/2]);
  }
  else if(name==='옥수수'){
    capsule(g,0xe8c64e,[0,0,0],.18,.55,[0,0,Math.PI/2]);
    capsule(g,0x64864b,[-.23,-.12,0],.09,.4,[0,0,.5]);
    capsule(g,0x64864b,[.23,-.12,0],.09,.4,[0,0,-.5]);
  }
  else if(name==='신문'){
    box(g,0xe8e2d2,[0,0,0],[.75,.53,.04]);
    for(let i=0;i<4;i++)box(g,0x474744,[0,.17-i*.1,.03],[.55,.025,.015]);
  }
  else{
    box(g,0xf3e8d0,[0,0,0],[.72,.56,.04]);
    box(g,0xb34438,[0,.2,.03],[.58,.08,.02]);
    ball(g,0x57483b,[0,-.04,.04],[.15,.15,.025]);
  }
  return g;
}

function nextName(){
  let n;
  do{
    n=itemNames[Math.floor(Math.random()*itemNames.length)];
  }while(n===lastName&&repeat>=2);
  if(n===lastName)repeat++;
  else{lastName=n;repeat=1}
  return n;
}
function sound(freq,duration){
  try{
    const ctx=sound.ctx||(sound.ctx=new AudioContext());
    if(ctx.state==='suspended')ctx.resume();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='triangle';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.start();osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
function spawn(){
  currentName=nextName();
  currentItem=makeItem(currentName);
  holder.add(currentItem);
  currentItem.scale.setScalar(1);
  itemTimer=0;
  sound(520,.08);
}
function clearItem(){
  if(currentItem){
    holder.remove(currentItem);
    currentItem=null;
  }
}
function finish(){
  if(!active)return;
  active=false;
  clearItem();
  turning=true;
  turnProgress=0;
  shake=.45;
  angry.visible=true;
  sound(110,.4);
  $('result').textContent=`훔친 물건 ${score}개`;
  $('end').classList.add('hidden');
}
function judge(direction){
  if(!active||!currentItem)return;

  const isCatch=catchItems.has(currentName);
  const correct=(isCatch&&direction==='down')||
                (!isCatch&&direction==='up');

  if(!correct){
    finish();
    return;
  }

  // 받기 성공한 물건만 집계
  if(isCatch){
    score++;
    $('score').textContent=score;
    sound(780,.1);
  }else{
    sound(250,.1);
  }

  combo++;
  if(combo%5===0)sound(1000,.18);

  clearItem();
  spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// 터치와 마우스 입력
renderer.domElement.addEventListener('pointerdown',e=>{
  if(!active||!currentItem)return;
  dragging=true;
  startY=e.clientY;
  dragY=0;
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  dragY=e.clientY-startY;
  const v=THREE.MathUtils.clamp(dragY/100,-1,1);
  // 팔은 고정, 손만 이동
  hand.position.y=handBaseY-v*.55;
});
window.addEventListener('pointerup',()=>{
  if(!dragging)return;
  dragging=false;
  if(Math.abs(dragY)>15)judge(dragY>0?'down':'up');
  hand.position.y=handBaseY;
});

// 게임 시작
function startGame(){
  active=true;
  time=60;
  score=0;
  combo=0;
  spawnTimer=.3;
  lastName='';
  repeat=0;
  turning=false;
  turnProgress=0;
  victim.rotation.y=Math.PI;
  head.rotation.y=0;
  angry.visible=false;
  clearItem();
  $('time').textContent=60;
  $('score').textContent=0;
  $('start').classList.add('hidden');
  $('end').classList.add('hidden');
}
$('startBtn').onclick=startGame;
$('again').onclick=startGame;

let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.05);
  last=now;

  if(active){
    time-=dt;
    $('time').textContent=Math.max(0,Math.ceil(time));

    if(time<=0)finish();

    if(active&&!currentItem){
      spawnTimer-=dt;
      if(spawnTimer<=0)spawn();
    }else if(active&&currentItem){
      itemTimer+=dt;
      // 아이템 크기는 처음부터 끝까지 고정
      currentItem.scale.setScalar(1);
      currentItem.rotation.y=Math.sin(now*.002)*.04;
      if(itemTimer>=3)finish();
    }
  }

  // 자경이가 몸 전체를 돌리고, 회전 완료 후 팝업
  if(turning){
    turnProgress=Math.min(1,turnProgress+dt*1.8);
    const eased=1-Math.pow(1-turnProgress,3);
    victim.rotation.y=Math.PI*(1-eased);

    if(turnProgress>=1){
      turning=false;
      $('end').classList.remove('hidden');
    }
  }

  // 손만 원위치로 부드럽게 복귀
  if(!dragging){
    hand.position.y+=(handBaseY-hand.position.y)*Math.min(1,dt*12);
  }

  if(shake>0){
    shake=Math.max(0,shake-dt);
    camera.position.x=(Math.random()-.5)*shake*.1;
  }else{
    camera.position.x=0;
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
