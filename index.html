<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bcbd9;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.logo,.stat{background:#f7f0dfed;color:#526e63;border:2px solid #fffaf0;box-shadow:0 3px 10px #53675b20}
.logo{padding:13px 17px;border-radius:16px;font-size:18px;font-weight:900}
.stats{display:flex;gap:7px}
.stat{min-width:68px;padding:9px 12px;border-radius:15px;text-align:center}
.stat small{display:block;font-size:11px;color:#788c7d}
.stat strong{font-size:23px}
#speech{position:fixed;z-index:3;top:19%;left:50%;transform:translateX(-50%);padding:8px 16px;background:#f7f0dfed;color:#52675d;border:1px solid #fffaf0;border-radius:18px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px #53675b20;pointer-events:none}
#speech:before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid #f7f0dfed}
#speech.tail-down:before{top:auto;bottom:-10px;border-bottom:0;border-top:11px solid #f7f0dfed}
.hidden{display:none!important}
#hint{position:fixed;left:18px;right:18px;bottom:calc(17px + env(safe-area-inset-bottom));min-height:52px;display:flex;align-items:center;justify-content:center;gap:22px;padding:10px 14px;z-index:4;border-radius:15px;background:#f6eedc;color:#61766a;font-size:clamp(12px,3.5vw,15px);font-weight:800;pointer-events:none}
.guide-part{display:flex;align-items:center;gap:7px;white-space:nowrap}
.guide-arrow{font-size:23px;line-height:1;color:#829b85;font-weight:900}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:5;background:#263b3d80}
.panel{width:min(390px,100%);max-height:92dvh;overflow:auto;background:#fff8e9;color:#40564b;border:2px solid white;border-radius:24px;padding:25px 20px;text-align:center;box-shadow:0 14px 40px #263b3c35}
.panel h1{font-size:30px;margin:0 0 12px}
.panel p{line-height:1.7}
.intro{font-size:34px;line-height:1.28;font-weight:1000;color:#bd8065;margin:16px 0}
.intro-sub{font-size:15px;line-height:1.8;font-weight:800}
.speech-preview{background:#f5edda;padding:11px;border-radius:16px;font-size:14px;font-weight:800;margin:12px 0}
.item-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 18px}
.preview-card{background:#f1eadb;border-radius:13px;padding:9px 3px 8px;min-width:0}
.preview-card svg{width:100%;height:43px;display:block;margin:auto}
.preview-card span{display:block;font-size:12px;font-weight:800;margin-top:5px}
button{border:0;border-radius:15px;background:#e8b36d;color:#51402d;padding:14px 32px;font-size:17px;font-weight:900;box-shadow:0 4px 0 #c9975b}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9975b}
#result{font-size:27px;font-weight:900;margin:20px 0}
@media(max-height:700px){#hint{bottom:calc(8px + env(safe-area-inset-bottom));min-height:44px}}

.music-control{position:fixed;top:82px;right:12px;z-index:6;display:flex;align-items:center;gap:8px;padding:5px 9px;background:#f7f0dfed;color:#526e63;border:2px solid #fffaf0;border-radius:14px;box-shadow:0 3px 10px #53675b20}
.music-control button{width:34px;height:34px;padding:0;border:0;border-radius:9px;background:transparent;box-shadow:none;font-size:19px;line-height:1}
.music-control button:active{transform:none;box-shadow:none}
.music-control input{width:78px;accent-color:#829b85}
@media(max-width:420px){.music-control{top:80px;right:10px}.music-control input{width:68px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="logo">환상의 짝꿍</div>
 <div class="stats">
  <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
  <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
 </div>
</div>
<div class="music-control">
 <button id="musicBtn" type="button" aria-label="음악 끄기">🔊</button>
 <input id="musicVolume" type="range" min="0" max="100" value="100" aria-label="음악 볼륨">
</div>
<div id="speech" class="hidden">척하면 척!</div>
<div id="hint" class="hidden">
 <div class="guide-part"><span class="guide-arrow">↓</span><span>아래로 드래그: 받기</span></div>
 <div class="guide-part"><span class="guide-arrow">↑</span><span>위로 드래그: 쳐내기</span></div>
</div>
<div class="overlay" id="start">
 <div class="panel">
  <div class="speech-preview">덕형과 한길의 완벽한 팀워크!</div>
  <div class="intro">나는 최고의<br>소매치기!</div>
  <div class="intro-sub">쥐도 새도 모르게 지갑만 쏙!<br>여유로운 행인의 주머니를 털어라!</div>
  <div class="item-preview">
   <div class="preview-card"><svg viewBox="0 0 60 48"><rect x="7" y="10" width="46" height="29" rx="6" fill="#98775f"/><rect x="10" y="13" width="40" height="22" rx="4" fill="#b99a7c"/><circle cx="44" cy="24" r="3" fill="#e6cda0"/></svg><span>지갑</span></div>
   <div class="preview-card"><svg viewBox="0 0 60 48"><rect x="6" y="9" width="48" height="30" rx="2" fill="#f7f0dc" stroke="#bdb39a"/><rect x="10" y="13" width="40" height="22" fill="#e6e9d8"/><circle cx="30" cy="24" r="8" fill="none" stroke="#718b92" stroke-width="2"/><path d="M13 18h8M39 30h8" stroke="#718b92" stroke-width="2"/></svg><span>돈</span></div>
   <div class="preview-card"><svg viewBox="0 0 60 48"><rect x="17" y="5" width="26" height="39" rx="4" fill="#eee8d8" stroke="#c9bda6"/><rect x="17" y="5" width="26" height="12" rx="3" fill="#c77d75"/><rect x="17" y="31" width="26" height="13" fill="#e8e5dd"/></svg><span>담뱃갑</span></div>
   <div class="preview-card"><svg viewBox="0 0 60 48"><path d="M11 27 Q14 8 31 8 Q47 8 49 27 Z" fill="#7897aa"/><path d="M8 27 Q30 23 53 29 Q47 37 25 35 Q12 34 8 27" fill="#5d7e94"/></svg><span>모자</span></div>
   <div class="preview-card"><svg viewBox="0 0 60 48"><rect x="19" y="5" width="22" height="38" rx="7" fill="#bdc8c8"/><rect x="19" y="5" width="22" height="19" rx="7" fill="#e0e5df"/><rect x="19" y="24" width="22" height="19" fill="#bdc8c8"/></svg><span>라이터</span></div>
  </div>
  <button id="startBtn">작전 시작</button>
 </div>
</div>
<div class="overlay hidden" id="end">
 <div class="panel">
  <h1>작전 발각!</h1>
  <p>자경이에게 들켰습니다!</p>
  <div id="result">훔친 물건 0개</div>
  <button id="again">다시 도전하기</button>
 </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const $=id=>document.getElementById(id);

// BGM
const bgm=new Audio('https://raw.githubusercontent.com/minapark320/best-duo/main/best%20duo.mp3');
bgm.loop=true;
bgm.preload='auto';
bgm.volume=0;
let bgmMuted=false;
const bgmMaxOutput=.42;
let bgmVolume=bgmMaxOutput;
let bgmFadeFrame=0;

function fadeBgm(target,duration=700){
 cancelAnimationFrame(bgmFadeFrame);
 const from=bgm.volume;
 const began=performance.now();
 function step(now){
  const p=Math.min(1,(now-began)/duration);
  const eased=1-Math.pow(1-p,3);
  bgm.volume=Math.max(0,Math.min(1,from+(target-from)*eased));
  if(p<1)bgmFadeFrame=requestAnimationFrame(step);
 }
 bgmFadeFrame=requestAnimationFrame(step);
}
function startBgm(){
 if(bgm.paused){
  bgm.play().then(()=>{if(!bgmMuted)fadeBgm(bgmVolume,1200)})
   .catch(error=>console.warn('BGM 재생 실패:',error));
 }else if(!bgmMuted){fadeBgm(bgmVolume,700)}
}
function toggleBgm(){
 bgmMuted=!bgmMuted;
 $('musicBtn').textContent=bgmMuted?'🔇':'🔊';
 $('musicBtn').setAttribute('aria-label',bgmMuted?'음악 켜기':'음악 끄기');
 if(bgmMuted){fadeBgm(0,550)}
 else{startBgm();fadeBgm(bgmVolume,850)}
}
function changeBgmVolume(value){
 bgmVolume=(Number(value)/100)*bgmMaxOutput;
 if(!bgmMuted)fadeBgm(bgmVolume,160);
}
$('musicBtn').addEventListener('click',toggleBgm);
$('musicVolume').addEventListener('input',e=>changeBgmVolume(e.target.value));

// THREE.JS 장면
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bcbd9);
scene.fog=new THREE.Fog(0x9bcbd9,38,85);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,150);
camera.position.set(0,4.8,11.8);
camera.lookAt(0,3.65,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.88;
$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf4fbff,0x8b8068,1.5));
const sun=new THREE.DirectionalLight(0xfff0d8,1.65);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function mat(c,roughness=.9){return new THREE.MeshStandardMaterial({color:c,roughness})}
function box(p,c,pos,size,r=.1){
 const m=new THREE.Mesh(new RoundedBoxGeometry(size[0],size[1],size[2],5,r),mat(c));
 m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;
}
function ball(p,c,pos,s=[1,1,1]){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.5,32,24),mat(c));
 m.position.set(...pos);m.scale.set(...s);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;
}
function capsule(p,c,pos,r,l,rot=[0,0,0]){
 const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,l,8,20),mat(c));
 m.position.set(...pos);m.rotation.set(...rot);m.castShadow=true;p.add(m);return m;
}

// 효과음
let audioContext=null;
function initAudio(){
 try{
  if(!audioContext){
   const A=window.AudioContext||window.webkitAudioContext;
   if(!A)return;
   audioContext=new A();
  }
  if(audioContext.state==='suspended')audioContext.resume();
 }catch(e){}
}
function tone(freq,start,duration,type='sine',volume=.15,endFreq=null){
 if(!audioContext)return;
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,start);
 if(endFreq!==null)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),start+duration);
 gain.gain.setValueAtTime(.001,start);
 gain.gain.exponentialRampToValueAtTime(Math.min(volume*1.6,.85),start+.012);
 gain.gain.exponentialRampToValueAtTime(.001,start+duration);
 osc.connect(gain);gain.connect(audioContext.destination);
 osc.start(start);osc.stop(start+duration+.02);
}
function noiseBurst(start,duration,volume=.2,filterFreq=1200){
 if(!audioContext)return;
 const length=Math.max(1,Math.floor(audioContext.sampleRate*duration));
 const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=audioContext.createBufferSource();
 const filter=audioContext.createBiquadFilter();
 const gain=audioContext.createGain();
 source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(filterFreq,start);
 gain.gain.setValueAtTime(Math.min(volume*1.6,.85),start);
 gain.gain.exponentialRampToValueAtTime(.001,start+duration);
 source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
 source.start(start);source.stop(start+duration);
}
function playSfx(type){
 if(!audioContext)return;
 const now=audioContext.currentTime;
 if(type==='spawn'){
  tone(520,now,.09,'sine',.055,680);
 }else if(type==='catch'){
  tone(880,now,.16,'sine',.18,1180);
  tone(1320,now+.09,.22,'sine',.13,1580);
  tone(1760,now+.17,.18,'sine',.07,1900);
 }else if(type==='deflect'){
  tone(155,now,.19,'triangle',.3,75);
  tone(95,now+.015,.16,'sine',.2,55);
  noiseBurst(now,.18,.2,1500);
  tone(430,now+.055,.1,'triangle',.08,220);
 }else if(type==='wrong'){
  tone(180,now,.3,'sawtooth',.2,75);
  tone(110,now+.04,.25,'triangle',.16,55);
 }else if(type==='gameover'){
  tone(220,now,.38,'triangle',.2,130);
  tone(155,now+.22,.48,'sawtooth',.16,65);
  tone(75,now+.35,.55,'sine',.2,42);
 }
}
