
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8cccf0;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.logo,.stat{background:#293c36e8;color:white;border-radius:14px;padding:9px 12px;box-shadow:0 3px 12px #263b3540}
.logo{font-weight:900;font-size:17px}
.stats{display:flex;gap:6px}
.stat{text-align:center;min-width:58px}
.stat small{display:block;font-size:9px;letter-spacing:1px;color:#d9e8dd}
.stat strong{font-size:21px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#172b2966;padding:20px;z-index:5}
.panel{width:min(390px,100%);background:#fff8e9;color:#293a32;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 15px 45px #243b3c66}
.panel h1{font-size:clamp(27px,7vw,38px);margin:0 0 12px}
.panel p{line-height:1.7}
.panel .result{font-size:25px;font-weight:900;margin:20px 0}
.intro{font-size:clamp(25px,7vw,35px);font-weight:1000;line-height:1.3;margin:0 0 15px;color:#a34b2e}
.intro-sub{font-weight:800;font-size:16px;line-height:1.7}
.intro-small{font-size:13px;color:#786c5b;margin:18px 0}
button{background:#e9a64c;color:#34271c;border:0;border-radius:14px;padding:14px 32px;font-size:17px;font-weight:900}
.hidden{display:none!important}
#hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:white;font-weight:800;text-shadow:0 2px 5px #263b35;pointer-events:none;z-index:2;font-size:13px}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="logo">환상의 짝꿍</div>
  <div class="stats">
    <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
    <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
  </div>
</div>
<div id="hint" class="hidden">아래로 드래그: 받기　/　위로 드래그: 쳐내기</div>

<div class="overlay" id="start">
  <div class="panel">
    <h1>환상의 짝꿍</h1>
    <div class="intro">나는 최고의<br>소매치기!</div>
    <div class="intro-sub">
      쥐도 새도 모르게 지갑만 쏙!<br>
      여유로운 행인의 주머니를 털어라!
    </div>
    <p class="intro-small">
      덕형과 한길의 완벽한 팀워크.<br>
      자경이에게 들키지 않고 작전을 성공시켜라!
    </p>
    <button id="startBtn">작전 시작</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <h1>지금 뭐 하시는 거예요?</h1>
    <p>자경이에게 들켰습니다!</p>
    <div class="result" id="result">훔친 물건 0개</div>
    <button id="again">다시 도전하기</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);

// ======================================
// 기본 장면
// ======================================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d0f4);
scene.fog=new THREE.Fog(0x91d0f4,28,60);

const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.1,6.9);
camera.lookAt(0,2.35,.1);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$('game').appendChild(renderer.domElement);

// 조명
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));

const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// ======================================
// 도형과 재질 도우미
// ======================================
function mat(color,roughness=.85){
  return new THREE.MeshStandardMaterial({color,roughness});
}

function addMesh(parent,geometry,color,pos,scale=[1,1,1]){
  const m=new THREE.Mesh(geometry,mat(color));
  m.position.set(...pos);
  m.scale.set(...scale);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function ball(parent,color,pos,scale=[1,1,1],radius=.5){
  return addMesh(
    parent,
    new THREE.SphereGeometry(radius,24,18),
    color,pos,scale
  );
}

function box(parent,color,pos,size,bevel=.06){
  const m=addMesh(
    parent,
    new THREE.BoxGeometry(...size),
    color,pos
  );
  return m;
}

function capsule(parent,color,pos,radius=.18,length=.5,rotation=[0,0,0]){
  const m=addMesh(
    parent,
    new THREE.CapsuleGeometry(radius,length,6,16),
    color,pos
  );
  m.rotation.set(...rotation);
  return m;
}

function roundedLimb(parent,color,a,b,radius){
  const start=new THREE.Vector3(...a);
  const end=new THREE.Vector3(...b);
  const dir=new THREE.Vector3().subVectors(end,start);
  const length=dir.length();

  const m=new THREE.Mesh(
    new THREE.CapsuleGeometry(radius,length,6,16),
    mat(color)
  );

  m.position.copy(start).add(end).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

// ======================================
// 시골 비포장도로 배경
// ======================================
const ground=addMesh(
  scene,new THREE.PlaneGeometry(100,100),
  0x8da96b,[0,-.15,-5]
);
ground.rotation.x=-Math.PI/2;

const road=addMesh(
  scene,new THREE.PlaneGeometry(7,65),
  0xb9956d,[0,-.08,-12]
);
road.rotation.x=-Math.PI/2;
road.position.y=-.07;

// 자갈
for(let i=0;i<65;i++){
  const s=.035+Math.random()*.1;
  const stone=addMesh(
    scene,new THREE.DodecahedronGeometry(s),
    Math.random()>.5?0x8d806c:0xb7a18a,
    [(Math.random()-.5)*5.8,-.015,-30+Math.random()*35],
    [1.5,.4,1]
  );
}

// 길가 풀
for(let i=0;i<70;i++){
  const side=Math.random()>.5?1:-1;
  const x=side*(4+Math.random()*7);
  const z=-28+Math.random()*35;

  capsule(scene,0x547b45,[x,.2,z],.035,.35,
    [0,0,(Math.random()-.5)*.8]);

  if(i%5===0){
    ball(scene,0xe8d99b,[x,.45,z],[.08,.08,.08],.08);
  }
}

// 울타리
for(const side of [-1,1]){
  for(let i=0;i<10;i++){
    box(scene,0x806044,[side*5.2,.55,-27+i*3],
      [.16,1.1,.16]);
  }
  for(const y of [.45,.85]){
    box(scene,0x9a7955,[side*5.2,y,-13],
      [.13,.13,30]);
  }
}

// 언덕
for(let i=0;i<12;i++){
  const h=2+Math.random()*3;
  ball(scene,0x739a70,[-22+i*4,h*.25,-27],
    [3.5,h,2],1);
}

// 구름
for(let i=0;i<8;i++){
  const cloud=new THREE.Group();
  ball(cloud,0xfaf8ed,[0,0,0],[1.5,.55,.7]);
  ball(cloud,0xfaf8ed,[-.8,-.1,.05],[.85,.42,.6]);
  ball(cloud,0xfaf8ed,[.85,-.1,0],[.9,.45,.6]);
  cloud.position.set(-14+i*4,9+(i%3),-20);
  scene.add(cloud);
}

// ======================================
// 자경이
// 참고 이미지 기준: 단순한 3D 인체
// ======================================
const victim=new THREE.Group();
scene.add(victim);
victim.position.set(0,0,-.15);
victim.scale.setScalar(1.25);

// 하체
const lower=new THREE.Group();
lower.position.y=.78;
victim.add(lower);

// 바지 골반
box(lower,0x514237,[0,-.08,0],[1.05,.62,.65],.1);

// 바지 다리
for(const side of [-1,1]){
  const leg=new THREE.Group();
  leg.position.set(side*.27,-.3,0);
  lower.add(leg);

  roundedLimb(leg,0x514237,[0,0,0],[0,-.92,0],.19);
  ball(leg,0x40362e,[0,-.98,.12],[.22,.12,.34],.25);
}

// 상체 회전 그룹
const torso=new THREE.Group();
torso.position.y=1.5;
victim.add(torso);

// 흰 셔츠 몸통
box(torso,0xf0eee5,[0,0,0],[1.48,1.55,.78],.12);

// 어깨 라인
for(const side of [-1,1]){
  ball(torso,0xf0eee5,[side*.69,.48,0],[.28,.3,.36],.35);
}

// 목
capsule(torso,0xe8b18f,[0,.89,0],.17,.24);

// 소매와 팔
// 팔이 몸통 뒤에 가려지지 않도록 바깥쪽으로 넓게 배치
const victimArms=[];

for(const side of [-1,1]){
  const arm=new THREE.Group();
  arm.position.set(side*.73,.42,.02);
  torso.add(arm);

  // 짧은 흰색 소매
  capsule(
    arm,0xf0eee5,
    [side*.10,-.12,0],
    .23,.30,
    [0,0,-side*.12]
  );

  // 어깨 관절
  ball(arm,0xf0eee5,[side*.12,-.26,0],
    [.22,.22,.22],.22);

  // 팔꿈치 위치
  const elbow=new THREE.Group();
  elbow.position.set(side*.17,-.53,0);
  arm.add(elbow);

  // 피부색 위팔
  capsule(elbow,0xe8b18f,[side*.015,-.30,.01],
    .145,.34,[0,0,-side*.02]);

  // 팔꿈치
  ball(elbow,0xe8b18f,[side*.02,-.59,.01],
    [.15,.15,.15],.15);

  // 아래팔
  capsule(elbow,0xe8b18f,[side*.02,-.91,.02],
    .15,.34);

  // 손목과 손
  const wrist=new THREE.Group();
  wrist.position.set(side*.02,-1.19,.03);
  elbow.add(wrist);

  ball(wrist,0xe8b18f,[0,0,0],[.15,.15,.15],.15);
  ball(wrist,0xe8b18f,[0,-.15,.03],[.17,.2,.13],.2);

  for(let f=0;f<4;f++){
    capsule(wrist,0xe8b18f,
      [-.1+f*.065,-.31,.04],
      .035,.11
    );
  }

  victimArms.push(arm);
}

// 멜빵
for(const side of [-1,1]){
  const strap=box(
    torso,0x795338,
    [side*.36,.02,.405],
    [.14,1.02,.07]
  );
  strap.rotation.z=-side*.2;

  box(torso,0x98704b,
    [side*.36,.48,.45],[.18,.15,.045]);
}

// 뒤쪽 V자 멜빵 연결
const backStrap=new THREE.Group();
backStrap.position.set(0,-.08,-.405);
torso.add(backStrap);

const strapLeft=box(backStrap,0x795338,
  [-.18,.1,0],[.13,.72,.055]);
strapLeft.rotation.z=-.45;

const strapRight=box(backStrap,0x795338,
  [.18,.1,0],[.13,.72,.055]);
strapRight.rotation.z=.45;

box(backStrap,0x795338,[0,-.28,0],[.15,.22,.055]);

// 앞쪽 멜빵 연결부
box(torso,0x795338,[0,-.48,.405],[.18,.12,.06]);

// 셔츠 깃
for(const side of [-1,1]){
  const collar=box(torso,0xe4dfd5,
    [side*.12,.76,.4],[.22,.19,.05]);
  collar.rotation.z=side*.28;
}

// ======================================
// 머리와 머리카락
// ======================================
const head=new THREE.Group();
head.position.set(0,1.12,.01);
torso.add(head);

// 얼굴
ball(head,0xe8b18f,[0,0,0],[.58,.67,.53],.65);

// 뒤통수 머리카락
ball(head,0x211d20,[0,.18,-.13],[.62,.55,.55],.65);
ball(head,0x211d20,[0,.47,-.06],[.55,.24,.47],.55);

// 앞머리
ball(head,0x211d20,[-.2,.4,.28],[.35,.22,.18],.3);
ball(head,0x211d20,[.13,.34,.3],[.3,.17,.16],.3);

// 옆머리
ball(head,0x211d20,[-.42,.13,.18],[.17,.36,.2],.22);
ball(head,0x211d20,[.42,.13,.18],[.17,.36,.2],.22);

// 귀
for(const side of [-1,1]){
  ball(head,0xe8b18f,[side*.58,-.04,0],
    [.13,.18,.13],.18);
}

// 코
ball(head,0xd99d7c,[0,-.08,.51],[.07,.09,.07],.09);

// 눈
for(const side of [-1,1]){
  ball(head,0x292321,[side*.2,.08,.49],
    [.04,.06,.025],.06);
}

// 안경
const glasses=new THREE.Group();
head.add(glasses);

for(const side of [-1,1]){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.17,.025,8,24),
    mat(0x292727)
  );
  ring.position.set(side*.21,.08,.52);
  glasses.add(ring);
}
box(glasses,0x292727,[0,.08,.53],[.12,.035,.035]);

// 화난 눈썹
const angry=new THREE.Group();
head.add(angry);

for(const side of [-1,1]){
  const brow=box(angry,0x29201e,
    [side*.21,.29,.53],[.22,.045,.035]);
  brow.rotation.z=side*.3;
}
angry.visible=false;

// 입
const mouth=box(head,0x74443c,[0,-.23,.51],[.15,.025,.025]);

// 책
const book=new THREE.Group();
book.position.set(.57,-.12,.35);
book.rotation.set(-.12,.12,-.15);
torso.add(book);

box(book,0x70432f,[0,0,0],[.43,.62,.12]);
box(book,0xe9d9b9,[0,0,.07],[.37,.55,.025]);
box(book,0x70432f,[-.13,0,.09],[.035,.54,.025]);

// ======================================
// 덕형의 왼쪽 팔
// 화면 가장자리에서 길게 보이도록 배치
// ======================================
const leftArm=new THREE.Group();
leftArm.position.set(-2.0,1.35,2.5);
scene.add(leftArm);

// 상완
capsule(leftArm,0x59734e,[0,.65,0],.25,.75);

// 팔꿈치
ball(leftArm,0x59734e,[0,.05,0],[.25,.25,.25],.25);

// 아래팔
capsule(leftArm,0x59734e,[.15,-.38,0],.22,.55,
  [0,0,-.3]);

// 손목
const leftHand=new THREE.Group();
leftHand.position.set(.28,-.78,.08);
leftArm.add(leftHand);

ball(leftHand,0xf1c19d,[0,0,0],[.23,.2,.17],.3);
for(let i=0;i<4;i++){
  capsule(leftHand,0xf1c19d,
    [.14,-.1+i*.07,.02],.045,.12);
}

// ======================================
// 한길의 오른쪽 팔
// ======================================
const rightArm=new THREE.Group();
rightArm.position.set(2.0,.95,2.8);
scene.add(rightArm);

// 팔은 고정
capsule(rightArm,0x84968b,[0,.55,0],.27,.85);
ball(rightArm,0x84968b,[0,-.02,0],[.27,.27,.27],.27);
capsule(rightArm,0x84968b,[-.18,-.43,0],.23,.55,
  [0,0,.3]);

// 손만 움직임
const hand=new THREE.Group();
hand.position.set(-.35,-.78,.12);
rightArm.add(hand);
const handBaseY=hand.position.y;

ball(hand,0xf1c19d,[0,0,0],[.27,.22,.17],.35);
for(let i=0;i<4;i++){
  capsule(hand,0xf1c19d,
    [-.17,-.14+i*.08,.02],.055,.15);
}
capsule(hand,0xf1c19d,[.16,-.15,.05],.06,.16,
  [0,0,.7]);

// ======================================
// 아이템
// ======================================
const holder=new THREE.Group();
holder.position.set(-1.25,1.65,2.4);
scene.add(holder);

const itemNames=[
  '지갑','돈','담뱃갑','모자','라이터',
  '돌','벽돌','막대기','수배 전단지','옥수수'
];

const catchItems=new Set([
  '지갑','돈','담뱃갑','모자','라이터'
]);

let currentItem=null;
let currentName='';
let itemTimer=0;
let spawnTimer=0;
let score=0;
let time=60;
let active=false;
let combo=0;
let lastName='';
let repeat=0;
let dragging=false;
let startY=0;
let dragY=0;
let turning=false;
let turnProgress=0;
let shake=0;

function makeItem(name){
  const g=new THREE.Group();

  if(name==='지갑'){
    box(g,0x754a34,[0,0,0],[.65,.44,.14]);
    box(g,0x9a7354,[0,.02,.09],[.56,.07,.025]);
    ball(g,0xd9b56c,[.2,0,.12],[.06,.08,.04]);
  }
  else if(name==='돈'){
    box(g,0xf5f0dc,[0,0,0],[.72,.45,.04]);
    box(g,0x304d76,[0,0,.03],[.62,.35,.015]);
    ball(g,0xf5f0dc,[0,0,.05],[.12,.13,.02]);
  }
  else if(name==='담뱃갑'){
    box(g,0xe7e0cb,[0,0,0],[.42,.62,.22]);
    box(g,0xb43e37,[0,.2,.12],[.42,.2,.025]);
    box(g,0xeeeeea,[0,-.13,.12],[.42,.18,.025]);
  }
  else if(name==='모자'){
    addMesh(g,new THREE.CylinderGeometry(.28,.35,.28,20),
      0x284455,[0,.08,0]);
    addMesh(g,new THREE.CylinderGeometry(.48,.48,.07,24),
      0x284455,[0,-.08,.04]);
  }
  else if(name==='라이터'){
    box(g,0xb9c1c5,[0,0,0],[.3,.48,.2]);
    box(g,0x727b80,[.04,.26,0],[.17,.08,.22]);
    box(g,0xe1e5e7,[0,-.05,.105],[.22,.2,.012]);
  }
  else if(name==='돌'){
    addMesh(g,new THREE.DodecahedronGeometry(.34),
      0x747b79,[0,0,0],[1.2,.9,1]);
  }
  else if(name==='벽돌'){
    box(g,0xa64e3d,[0,0,0],[.7,.4,.36]);
  }
  else if(name==='막대기'){
    capsule(g,0x79532f,[0,0,0],.09,.9,
      [0,0,Math.PI/2]);
  }
  else if(name==='옥수수'){
    capsule(g,0xe8c64e,[0,0,0],.18,.55,
      [0,0,Math.PI/2]);
    capsule(g,0x64864b,[-.23,-.12,0],.09,.4,[0,0,.5]);
    capsule(g,0x64864b,[.23,-.12,0],.09,.4,[0,0,-.5]);
  }
  else if(name==='수배 전단지'){
    box(g,0xf3e8d0,[0,0,0],[.72,.56,.04]);
    box(g,0xb34438,[0,.2,.03],[.58,.08,.02]);

    const face=new THREE.Mesh(
      new THREE.CircleGeometry(.13,20),
      mat(0xe1d3b8)
    );
    face.position.set(0,-.04,.04);
    g.add(face);

    for(const x of [-.045,.045]){
      box(g,0x292522,[x,0,.065],[.025,.025,.012]);
    }
    box(g,0x292522,[0,-.045,.065],[.018,.045,.012]);
    box(g,0x292522,[0,-.09,.065],[.09,.018,.012]);
  }
  return g;
}

function nextName(){
  let n;
  do{
    n=itemNames[Math.floor(Math.random()*itemNames.length)];
  }while(n===lastName&&repeat>=2);

  if(n===lastName)repeat++;
  else{
    lastName=n;
    repeat=1;
  }
  return n;
}

function sound(freq,duration){
  try{
    const ctx=sound.ctx||(sound.ctx=new AudioContext());
    if(ctx.state==='suspended')ctx.resume();

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type='triangle';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,ctx.currentTime+duration
    );
    osc.start();
    osc.stop(ctx.currentTime+duration);
  }catch(e){}
}

function spawn(){
  currentName=nextName();
  currentItem=makeItem(currentName);
  holder.add(currentItem);
  currentItem.scale.setScalar(1);
  itemTimer=0;
  sound(520,.08);
}

function clearItem(){
  if(currentItem){
    holder.remove(currentItem);
    currentItem=null;
  }
}

function finish(){
  if(!active)return;
  active=false;
  clearItem();
  turning=true;
  turnProgress=0;
  shake=.45;
  angry.visible=true;
  sound(110,.4);
  $('result').textContent=`훔친 물건 ${score}개`;
}

function judge(direction){
  if(!active||!currentItem)return;

  const isCatch=catchItems.has(currentName);
  const correct=(isCatch&&direction==='down')||
                (!isCatch&&direction==='up');

  if(!correct){
    finish();
    return;
  }

  if(isCatch){
    score++;
    $('score').textContent=score;
    sound(780,.1);
  }else{
    sound(250,.1);
  }

  combo++;
  if(combo%5===0)sound(1000,.18);

  clearItem();
  spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// ======================================
// 드래그 조작
// ======================================
renderer.domElement.addEventListener('pointerdown',e=>{
  if(!active||!currentItem)return;
  dragging=true;
  startY=e.clientY;
  dragY=0;
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  dragY=e.clientY-startY;

  const v=THREE.MathUtils.clamp(dragY/100,-1,1);
  hand.position.y=handBaseY-v*.55;
});

window.addEventListener('pointerup',()=>{
  if(!dragging)return;
  dragging=false;

  if(Math.abs(dragY)>15){
    judge(dragY>0?'down':'up');
  }
  hand.position.y=handBaseY;
});

// ======================================
// 게임 시작
// ======================================
function startGame(){
  active=true;
  time=60;
  score=0;
  combo=0;
  spawnTimer=.3;
  lastName='';
  repeat=0;
  turning=false;
  turnProgress=0;

  victim.rotation.y=Math.PI;
  torso.rotation.set(0,0,0);
  head.rotation.set(0,0,0);
  angry.visible=false;

  clearItem();

  $('time').textContent=60;
  $('score').textContent=0;
  $('start').classList.add('hidden');
  $('end').classList.add('hidden');
  $('hint').classList.remove('hidden');
}

$('startBtn').onclick=startGame;
$('again').onclick=startGame;

// ======================================
// 애니메이션
// ======================================
let last=performance.now();

function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min((now-last)/1000,.05);
  last=now;

  if(active){
    time-=dt;
    $('time').textContent=Math.max(0,Math.ceil(time));

    if(time<=0)finish();

    if(active&&!currentItem){
      spawnTimer-=dt;
      if(spawnTimer<=0)spawn();
    }
    else if(active&&currentItem){
      itemTimer+=dt;
      currentItem.scale.setScalar(1);
      currentItem.rotation.y=Math.sin(now*.002)*.04;

      if(itemTimer>=3)finish();
    }
  }

  // 자경이가 몸을 돌려 플레이어를 바라봄
  if(turning){
    turnProgress=Math.min(1,turnProgress+dt*1.8);
    const eased=1-Math.pow(1-turnProgress,3);

    victim.rotation.y=Math.PI*(1-eased);
    torso.rotation.x=-.08*eased;
    head.rotation.x=-.1*eased;

    if(turnProgress>=1){
      turning=false;
      $('end').classList.remove('hidden');
      $('hint').classList.add('hidden');
    }
  }

  // 손 복귀
  if(!dragging){
    hand.position.y+=(handBaseY-hand.position.y)*
      Math.min(1,dt*12);
  }

  // 카메라 흔들림
  if(shake>0){
    shake=Math.max(0,shake-dt);
    camera.position.x=(Math.random()-.5)*shake*.1;
  }else{
    camera.position.x=0;
  }

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// 화면 크기 대응
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
