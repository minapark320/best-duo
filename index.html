
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd6f4;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;pointer-events:none}
.logo,.stat{background:#eaf0e9ed;color:#344d4a;border:1px solid #fff;border-radius:11px;padding:11px 14px;box-shadow:0 3px 9px #263b3520}
.logo{font-weight:1000;font-size:17px}
.stats{display:flex;gap:7px}
.stat{text-align:center;min-width:65px}
.stat small{display:block;font-size:10px;color:#6d8177}
.stat strong{font-size:23px;color:#344d4a}
#speech{
 position:fixed;z-index:4;top:19%;left:50%;transform:translateX(-50%);
 background:#fff8e9;color:#34433e;border:2px solid white;
 border-radius:20px;padding:12px 23px;font-size:20px;font-weight:1000;
 white-space:nowrap;box-shadow:0 4px 0 #d7c5a8,0 8px 16px #263b3530;
 pointer-events:none
}
#speech:after{
 content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);
 border-style:solid;border-width:15px 11px 0;border-color:#fff8e9 transparent transparent
}
#speech.hidden{display:none}
#hint{position:fixed;bottom:22px;left:0;right:0;z-index:3;text-align:center;color:white;font-size:14px;font-weight:1000;text-shadow:0 2px 5px #263b35;pointer-events:none}
#hint.hidden{display:none}
.overlay{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:#203a466e;padding:18px}
.panel{width:min(390px,100%);background:#fff8e9;color:#34433e;border:2px solid white;border-radius:20px;padding:23px 20px;text-align:center;box-shadow:0 12px 35px #142c3b66}
.panel h1{font-size:29px;margin:0 0 10px}
.panel p{line-height:1.65}
.intro{font-size:32px;font-weight:1000;line-height:1.25;color:#bd6747;margin:12px 0}
.intro-sub{font-size:14px;font-weight:800;line-height:1.7}
.preview{
 position:relative;height:185px;overflow:hidden;border-radius:15px;
 margin:15px 0;background:linear-gradient(#8ed5f4 0 48%,#a9c98e 48% 68%,#d8bd91 68%);
 border:1px solid #e5dccb
}
.preview .hill{position:absolute;bottom:65px;width:180px;height:85px;border-radius:50%;background:#8eae7b}
.preview .hill.one{left:-40px}
.preview .hill.two{right:-30px;background:#a2c68c}
.preview .person{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);width:115px;height:145px;background:#eeeae0;border-radius:25px 25px 0 0}
.preview .head{position:absolute;top:-65px;left:50%;transform:translateX(-50%);width:105px;height:100px;border-radius:50%;background:#e9b58f}
.preview .hair{position:absolute;top:-72px;left:50%;transform:translateX(-50%) rotate(-8deg);width:110px;height:66px;border-radius:55% 50% 45% 45%;background:#211d20}
.preview .strap{position:absolute;top:0;width:10px;height:100px;background:#795338}
.preview .strap.left{left:25px}
.preview .strap.right{right:25px}
.preview .arm{position:absolute;top:12px;width:32px;height:115px;border-radius:18px;background:#627d58}
.preview .arm.left{left:25px;transform:rotate(-30deg)}
.preview .arm.right{right:25px;transform:rotate(30deg);background:#83998b}
.preview .hand{position:absolute;bottom:35px;width:45px;height:40px;border-radius:50%;background:#efc09d}
.preview .hand.left{left:28px}
.preview .hand.right{right:28px}
.preview .object{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:38px;height:52px;border-radius:5px;background:#eee5d3;border-top:15px solid #bd4035}
.preview .bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff8e9;border-radius:15px;padding:7px 12px;font-size:13px;font-weight:1000;white-space:nowrap}
.intro-small{font-size:12px;color:#817665;line-height:1.6;margin:12px 0}
button{border:0;border-radius:12px;background:#d96d50;color:white;padding:14px 28px;font-size:17px;font-weight:1000;box-shadow:0 4px 0 #a94d39}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a94d39}
.hidden{display:none!important}
#end{display:flex;align-items:flex-end;padding:0 12px 18px;background:linear-gradient(transparent,#142c3b55)}
#end .panel{padding:24px 20px 22px;animation:rise .35s ease-out}
#end .speechResult{display:inline-block;background:#e9eee9;border-radius:16px;padding:11px 16px;font-weight:1000;margin-bottom:12px}
.scoreResult{font-size:16px;font-weight:800;background:#e9eee9;border-radius:13px;padding:15px;margin:18px 0}
.scoreResult strong{display:block;font-size:34px;color:#bd6747;margin-top:4px}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="logo">환상의 짝꿍</div>
 <div class="stats">
  <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
  <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
 </div>
</div>

<div id="speech" class="hidden">척하면 척!</div>
<div id="hint" class="hidden">↓ 아래로 드래그: 받기　/　↑ 위로 드래그: 쳐내기</div>

<div class="overlay" id="start">
 <div class="panel">
  <h1>환상의 짝꿍</h1>
  <div class="preview">
   <div class="hill one"></div><div class="hill two"></div>
   <div class="person">
    <div class="head"></div><div class="hair"></div>
    <div class="strap left"></div><div class="strap right"></div>
   </div>
   <div class="arm left"></div><div class="arm right"></div>
   <div class="hand left"></div><div class="hand right"></div>
   <div class="object"></div>
   <div class="bubble">척하면 척!</div>
  </div>
  <div class="intro">나는 최고의<br>소매치기!</div>
  <div class="intro-sub">
   쥐도 새도 모르게 지갑만 쏙!<br>
   여유로운 행인의 주머니를 털어라!
  </div>
  <p class="intro-small">
   받을 물건은 아래로, 위험한 물건은 위로 드래그!
  </p>
  <button id="startBtn">작전 시작</button>
 </div>
</div>

<div class="overlay hidden" id="end">
 <div class="panel">
  <div class="speechResult">지금 뭐 하시는 거예요!</div>
  <h1>작전 발각!</h1>
  <p>자경이에게 들켰습니다.</p>
  <div class="scoreResult">훔친 물건<strong id="result">0개</strong></div>
  <button id="again">다시 도전하기</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=id=>document.getElementById(id);

// 장면
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd6f4);
scene.fog=new THREE.Fog(0x9bd6f4,28,65);

const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.5,8);
camera.lookAt(0,1.35,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));
const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function mat(color,roughness=.84){return new THREE.MeshStandardMaterial({color,roughness})}
function rounded(parent,color,pos,size,radius=.08){
 const m=new THREE.Mesh(new RoundedBoxGeometry(size[0],size[1],size[2],5,radius),mat(color));
 m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function sphere(parent,color,pos,scale){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.5,28,20),mat(color));
 m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function capsule(parent,color,pos,radius,length,rotation=[0,0,0]){
 const m=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length,6,18),mat(color));
 m.position.set(...pos);m.rotation.set(...rotation);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function alignLong(mesh,a,b){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const d=B.clone().sub(A);
 mesh.position.copy(A).add(B).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
 mesh.scale.set(1,d.length(),1);
}

// 배경
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x91b879));
ground.rotation.x=-Math.PI/2;ground.position.y=-.15;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,65),mat(0xc9a77c));
road.rotation.x=-Math.PI/2;road.position.set(0,-.07,-12);scene.add(road);

for(let i=0;i<55;i++){
 const s=.035+Math.random()*.09;
 const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(s),mat(0xb5a087));
 stone.position.set((Math.random()-.5)*5.8,-.015,-30+Math.random()*35);
 stone.scale.set(1.5,.4,1);scene.add(stone);
}
for(const side of [-1,1]){
 for(let i=0;i<10;i++)rounded(scene,0x806044,[side*5.2,.55,-27+i*3],[.16,1.1,.16],.04);
 for(const y of [.45,.85])rounded(scene,0x9a7955,[side*5.2,y,-13],[.13,.13,30],.04);
}
for(let i=0;i<12;i++){
 const h=2+Math.random()*3;
 sphere(scene,0x83ad78,[-22+i*4,h*.25,-27],[7,h*2,4]);
}
for(let i=0;i<8;i++){
 const c=new THREE.Group();
 sphere(c,0xfff9ed,[0,0,0],[3,.9,1.4]);
 sphere(c,0xfff9ed,[-.8,-.1,.05],[1.7,.8,1.2]);
 sphere(c,0xfff9ed,[.85,-.1,0],[1.8,.9,1.2]);
 c.position.set(-14+i*4,9+(i%3),-20);scene.add(c);
}

// 자경이: 화면 아래에 크게 고정
const victim=new THREE.Group();
scene.add(victim);
victim.position.set(0,-2.2,.05);
victim.scale.setScalar(1.9);

const torso=new THREE.Group();
torso.position.set(0,.85,0);
victim.add(torso);

// 긴팔 셔츠와 둥근 어깨
rounded(torso,0xf0eee5,[0,0,0],[1.18,1.45,.65],.16);
for(const side of [-1,1]){
 sphere(torso,0xf0eee5,[side*.57,.38,0],[.34,.34,.32]);
 rounded(torso,0xf0eee5,[side*.64,-.25,0],[.34,.95,.55],.13);
 sphere(torso,0xe8b18f,[side*.64,-.79,.02],[.15,.16,.15]);
}
capsule(torso,0xe8b18f,[0,.8,0],.17,.22);

// 앞 멜빵
for(const side of [-1,1]){
 rounded(torso,0x795338,[side*.3,-.02,.34],[.11,1.2,.045],.02);
}

// 얼굴
const head=new THREE.Group();
head.position.set(0,1.0,0);
torso.add(head);
sphere(head,0xe8b18f,[0,0,0],[.92,.94,.83]);

// 머리카락 한 덩어리, 납작하고 사선으로 붙는 형태
const hair=sphere(head,0x211d20,[0,.22,-.045],[.99,.62,.87]);
hair.rotation.z=-.13;

// 귀
for(const side of [-1,1]){
 sphere(head,0xe8b18f,[side*.47,-.02,.02],[.15,.19,.14]);
}

// 안경
const glasses=new THREE.Group();head.add(glasses);
for(const side of [-1,1]){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.17,.025,8,24),mat(0x242424));
 ring.position.set(side*.2,.04,.46);glasses.add(ring);
}
rounded(glasses,0x242424,[0,.04,.47],[.1,.035,.025],.01);

// 화난 눈썹
const brows=new THREE.Group();head.add(brows);
for(const side of [-1,1]){
 const b=rounded(brows,0x241d19,[side*.2,.28,.49],[.22,.05,.035],.015);
 b.rotation.z=side<0?-.32:.32;
}
brows.visible=false;

// 덕형과 한길의 팔
// 어깨부터 손목까지 하나의 메시로 연결, 중간 분리 없음
function makeArm(color){
 const group=new THREE.Group();scene.add(group);
 const sleeve=rounded(group,color,[0,0,0],[.62,1,.54],.16);
 const hand=sphere(group,0xf0bd9b,[0,0,0],[.37,.34,.34]);
 return {group,sleeve,hand};
}
const leftArm=makeArm(0x607b52);
const rightArm=makeArm(0x8ca194);

function updateArm(arm,shoulder,wrist,handOffset=0){
 alignLong(arm.sleeve,shoulder,wrist);
 arm.hand.position.set(wrist[0],wrist[1]+handOffset,wrist[2]+.04);
}

// 아이템
const holder=new THREE.Group();scene.add(holder);
const itemNames=['지갑','돈','담뱃갑','모자','라이터','돌','벽돌','나뭇가지','수배 전단지','옥수수'];
const catchItems=new Set(['지갑','돈','담뱃갑','모자','라이터']);

let currentItem=null,currentName='';
let active=false,time=60,score=0,spawnTimer=.3,itemTimer=0;
let lastName='',repeat=0,dragging=false,startY=0,dragY=0;
let turning=false,turnProgress=0,shake=0;
let leftSweep=0,handMove=0;

function makeItem(name){
 const g=new THREE.Group();
 if(name==='지갑'){
  rounded(g,0x754a34,[0,0,0],[.56,.38,.12],.045);
  rounded(g,0x9a7354,[0,.02,.07],[.48,.06,.02],.015);
  sphere(g,0xd9b56c,[.17,0,.09],[.1,.12,.06]);
 }else if(name==='돈'){
  rounded(g,0xf5f0dc,[0,0,0],[.62,.4,.035],.02);
  rounded(g,0x304d76,[0,0,.025],[.54,.32,.012],.015);
  sphere(g,0xf5f0dc,[0,0,.04],[.18,.2,.02]);
 }else if(name==='담뱃갑'){
  rounded(g,0xe7e0cb,[0,0,0],[.37,.54,.18],.03);
  rounded(g,0xb43e37,[0,.17,.1],[.37,.17,.02],.01);
  rounded(g,0xeeeeea,[0,-.12,.1],[.37,.16,.02],.01);
 }else if(name==='모자'){
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,.25,24),mat(0x284455));
  crown.position.y=.06;g.add(crown);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.06,24),mat(0x284455));
  brim.position.y=-.09;g.add(brim);
 }else if(name==='라이터'){
  rounded(g,0xb9c1c5,[0,0,0],[.27,.42,.17],.035);
  rounded(g,0x727b80,[.03,.23,0],[.15,.07,.18],.015);
 }else if(name==='돌'){
  const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.3),mat(0x747b79));
  m.scale.set(1.2,.9,1);g.add(m);
 }else if(name==='벽돌'){
  rounded(g,0xa64e3d,[0,0,0],[.62,.35,.3],.035);
 }else if(name==='나뭇가지'){
  capsule(g,0x79532f,[0,0,0],.055,.72,[0,0,Math.PI/2]);
  capsule(g,0x79532f,[.17,.1,0],.04,.28,[0,0,.7]);
  capsule(g,0x79532f,[-.18,-.08,0],.04,.25,[0,0,-.7]);
 }else if(name==='옥수수'){
  // 긴 노란 알맹이, 작은 초록 잎 두 장
  sphere(g,0xe9c442,[0,0,0],[.20,.62,.19]);
  capsule(g,0x4f8745,[-.11,-.34,.02],.075,.24,[0,0,-.45]);
  capsule(g,0x65974b,[.11,-.34,.02],.075,.24,[0,0,.45]);
 }else if(name==='수배 전단지'){
  rounded(g,0xf3e8d0,[0,0,0],[.62,.48,.035],.015);
  const outline=new THREE.Mesh(new THREE.TorusGeometry(.13,.012,6,24),mat(0x302c29));
  outline.position.set(0,-.015,.035);g.add(outline);
  for(const x of [-.05,.05])sphere(g,0x302c29,[x,.015,.05],[.025,.025,.012]);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute([
   -.105,-.065,.055,-.052,-.105,.055,0,-.065,.055,.052,-.105,.055,.105,-.065,.055
  ],3));
  g.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x302c29})));
  for(let i=0;i<2;i++)rounded(g,0x49423b,[0,-.19-i*.035,.03],[.34-i*.05,.012,.01],.004);
 }
 return g;
}

function nextName(){
 let n;
 do{n=itemNames[Math.floor(Math.random()*itemNames.length)]}
 while(n===lastName&&repeat>=2);
 if(n===lastName)repeat++;else{lastName=n;repeat=1}
 return n;
}

function sound(freq,duration){
 try{
  const ctx=sound.ctx||(sound.ctx=new AudioContext());
  if(ctx.state==='suspended')ctx.resume();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.type='triangle';osc.frequency.value=freq;
  gain.gain.setValueAtTime(.07,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.start();osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

function showSpeech(text){
 $('speech').textContent=text;
 $('speech').classList.remove('hidden');
}
function spawn(){
 currentName=nextName();
 currentItem=makeItem(currentName);
 holder.add(currentItem);
 itemTimer=0;
 leftSweep=0;
 showSpeech(Math.random()>.5?'척하면 척!':'딱하면 딱!');
 sound(520,.08);
}
function clearItem(){
 if(currentItem){holder.remove(currentItem);currentItem=null}
}
function finish(){
 if(!active)return;
 active=false;clearItem();
 $('hint').classList.add('hidden');
 $('speech').classList.add('hidden');
 turning=true;turnProgress=0;shake=.4;
 sound(110,.4);
}
function judge(direction){
 if(!active||!currentItem)return;
 const isCatch=catchItems.has(currentName);
 const correct=(isCatch&&direction==='down')||(!isCatch&&direction==='up');
 if(!correct){finish();return}
 if(isCatch){score++;$('score').textContent=score;sound(780,.1)}
 else sound(250,.1);
 clearItem();
 spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// 드래그
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!active||!currentItem)return;
 dragging=true;startY=e.clientY;dragY=0;
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 dragY=e.clientY-startY;
 handMove=THREE.MathUtils.clamp(dragY/170,-.7,.7);
});
window.addEventListener('pointerup',()=>{
 if(!dragging)return;
 dragging=false;
 if(Math.abs(dragY)>15)judge(dragY>0?'down':'up');
 handMove=0;
});

function startGame(){
 active=true;time=60;score=0;spawnTimer=.3;
 lastName='';repeat=0;turning=false;turnProgress=0;
 leftSweep=0;handMove=0;dragging=false;
 victim.rotation.y=Math.PI;brows.visible=false;
 clearItem();
 $('time').textContent='60';$('score').textContent='0';
 $('start').classList.add('hidden');$('end').classList.add('hidden');
 $('hint').classList.remove('hidden');$('speech').classList.add('hidden');
}
$('startBtn').onclick=startGame;
$('again').onclick=startGame;

// 애니메이션
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);last=now;

 if(active){
  time-=dt;$('time').textContent=Math.max(0,Math.ceil(time));
  if(time<=0)finish();
  if(active&&!currentItem){spawnTimer-=dt;if(spawnTimer<=0)spawn()}
  if(active&&currentItem){itemTimer+=dt;if(itemTimer>=3)finish()}
 }

 // 덕형 왼팔: 위에서 아래로 와이퍼처럼 내려옴
 const leftShoulder=[-2.5,4.2,3.7];
 const rightShoulder=[2.5,4.2,3.7];

 let leftWrist;
 if(currentItem&&active){
  leftSweep=Math.min(1,leftSweep+dt*1.55);
  const t=leftSweep*leftSweep*(3-2*leftSweep);
  leftWrist=[
   THREE.MathUtils.lerp(-1.05,-.25,t),
   THREE.MathUtils.lerp(3.0,1.85,t),
   3.9
  ];
  // 물건은 왼손에 붙어 중앙으로 이동
  holder.position.set(leftWrist[0]+.03,leftWrist[1]-.05,4.12);
 }else{
  leftWrist=[-.85,2.45,3.9];
 }

 // 한길 오른팔은 오른쪽 위에서 중앙에 대기
 const rightWrist=[
  .55,
  1.9+handMove,
  3.95
 ];

 // 각 팔은 어깨부터 손목까지 한 덩어리 소매
 updateArm(leftArm,leftShoulder,leftWrist,-.13);
 updateArm(rightArm,rightShoulder,rightWrist,-.13);

 // 게임오버 때 자경이가 정면으로 회전
 if(turning){
  turnProgress=Math.min(1,turnProgress+dt*1.8);
  const eased=1-Math.pow(1-turnProgress,3);
  victim.rotation.y=Math.PI*(1-eased);
  brows.visible=true;
  if(turnProgress>=1){
   turning=false;
   victim.rotation.y=0;
   $('result').textContent=score+'개';
   $('end').classList.remove('hidden');
  }
 }

 if(shake>0){
  shake=Math.max(0,shake-dt);
  camera.position.x=(Math.random()-.5)*shake*.1;
 }else camera.position.x=0;

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
