
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>환상의 짝꿍</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd6f4;font-family:Arial,"Noto Sans KR",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.logo,.stat{background:rgba(255,247,226,.94);color:#35534b;border:1px solid white;border-radius:12px;padding:10px 13px;box-shadow:0 4px 12px #263b3520}
.logo{font-weight:900;font-size:17px}
.stats{display:flex;gap:6px}
.stat{text-align:center;min-width:62px}
.stat small{display:block;font-size:10px;color:#71847b}
.stat strong{font-size:22px;color:#35534b}
#speech{position:fixed;z-index:3;top:17%;left:50%;transform:translateX(-50%);width:max-content;max-width:75%;background:rgba(255,249,235,.78);color:#35443c;border:1px solid #ffffffaa;border-radius:16px;padding:8px 15px;font-size:15px;font-weight:400;text-align:center;box-shadow:0 3px 10px #233b3520;pointer-events:none}
#speech:after{content:"";position:absolute;left:50%;top:-12px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid rgba(255,249,235,.78)}
#speech.hidden{display:none}
#hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:white;font-weight:800;text-shadow:0 2px 5px #263b35;pointer-events:none;z-index:3;font-size:13px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#172b2966;padding:20px;z-index:5}
.panel{width:min(410px,100%);max-height:90%;overflow:auto;background:#fff8e9;color:#293a32;border-radius:22px;padding:23px 20px;text-align:center;box-shadow:0 15px 45px #243b3c66;border:2px solid white}
.panel h1{font-size:clamp(26px,7vw,35px);margin:0 0 10px}
.panel p{line-height:1.6}
.intro{font-size:clamp(28px,7vw,36px);font-weight:900;line-height:1.25;color:#b85d36;margin:12px 0}
.intro-sub{font-weight:700;font-size:14px;line-height:1.7}
.section-title{font-size:12px;font-weight:800;color:#8c765a;text-align:left;margin:13px 0 7px}
.item-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.item-tile{background:#f1e8d8;border-radius:10px;padding:7px 2px 6px;min-width:0}
.item-tile svg{width:100%;height:35px;display:block}
.item-tile span{font-size:10px;font-weight:700;display:block;margin-top:3px;white-space:nowrap}
.item-groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group-label{font-size:12px;font-weight:900;margin-bottom:6px}
.group-label.receive{color:#54806a}
.group-label.reject{color:#b56b4a}
button{background:#e9a64c;color:#34271c;border:0;border-radius:13px;padding:14px 32px;font-size:17px;font-weight:900;box-shadow:0 4px 0 #bd7e36;margin-top:12px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #bd7e36}
.hidden{display:none!important}
.result{font-size:25px;font-weight:900;margin:20px 0}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="logo">환상의 짝꿍</div>
 <div class="stats">
  <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
  <div class="stat"><small>훔친 물건</small><strong id="score">0</strong></div>
 </div>
</div>

<div id="speech" class="hidden">척하면 척!</div>
<div id="hint" class="hidden">↓ 아래로 드래그: 받기　/　↑ 위로 드래그: 쳐내기</div>

<div class="overlay" id="start">
 <div class="panel">
  <h1>환상의 짝꿍</h1>
  <div class="intro">나는 최고의<br>소매치기!</div>
  <div class="intro-sub">쥐도 새도 모르게 지갑만 쏙!<br>덕형과 한길의 완벽한 팀워크!</div>

  <div class="section-title">아래 물건은 받아!</div>
  <div class="item-grid">
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="7" y="7" width="36" height="23" rx="5" fill="#795039"/><rect x="10" y="11" width="30" height="14" rx="3" fill="#a77a55"/><circle cx="35" cy="18" r="3" fill="#e5c16d"/></svg>
    <span>지갑</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="5" y="7" width="40" height="23" rx="2" fill="#f5f0dc"/><rect x="9" y="10" width="32" height="17" fill="#456a87"/><circle cx="25" cy="18" r="6" fill="#e8dfc7"/></svg>
    <span>돈</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="14" y="3" width="22" height="29" rx="3" fill="#e8e1d1"/><rect x="14" y="5" width="22" height="9" fill="#b94c42"/></svg>
    <span>담뱃갑</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><path d="M12 21 Q12 5 25 5 Q38 5 38 21Z" fill="#31546a"/><path d="M5 22 Q25 17 45 22 L43 27 Q25 23 7 27Z" fill="#31546a"/></svg>
    <span>모자</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="17" y="7" width="16" height="25" rx="3" fill="#aeb7ba"/><rect x="20" y="3" width="10" height="6" rx="1" fill="#626d71"/></svg>
    <span>라이터</span>
   </div>
  </div>

  <div class="section-title">이 물건은 쳐내!</div>
  <div class="item-grid">
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><path d="M8 23 L14 8 29 5 42 17 35 29 15 30Z" fill="#858b86"/></svg>
    <span>돌</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="6" y="8" width="38" height="21" rx="2" fill="#a95b47"/><circle cx="17" cy="18" r="3" fill="#633c34"/><circle cx="33" cy="18" r="3" fill="#633c34"/></svg>
    <span>벽돌</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><path d="M5 27 Q20 5 44 9" stroke="#79532f" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
    <span>나뭇가지</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="8" y="3" width="34" height="29" rx="2" fill="#f3e8d0"/><circle cx="25" cy="14" r="7" fill="none" stroke="#514b45" stroke-width="1.5"/><path d="M18 22 L22 24 25 22 28 24 32 22" stroke="#514b45" fill="none" stroke-width="1.5"/></svg>
    <span>수배 전단지</span>
   </div>
   <div class="item-tile">
    <svg viewBox="0 0 50 35"><rect x="13" y="3" width="24" height="29" rx="12" fill="#eac94c"/><path d="M13 24 Q7 18 10 9 Q18 14 19 23Z" fill="#54894c"/><path d="M37 24 Q43 18 40 9 Q32 14 31 23Z" fill="#54894c"/></svg>
    <span>옥수수</span>
   </div>
  </div>
  <p style="font-size:12px;color:#84745e">3초 안에 판단해야 해!</p>
  <button id="startBtn">작전 시작</button>
 </div>
</div>

<div class="overlay hidden" id="end">
 <div class="panel">
  <h1>작전 발각!</h1>
  <p>자경이에게 들켰습니다.</p>
  <div class="result" id="result">훔친 물건 0개</div>
  <button id="again">다시 도전하기</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd6f4);
scene.fog=new THREE.Fog(0x9bd6f4,30,70);

const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.85,8.8);
camera.lookAt(0,2.05,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x8b805d,2));
const sun=new THREE.DirectionalLight(0xffefcf,3);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function mat(color,roughness=.84){return new THREE.MeshStandardMaterial({color,roughness});}
function roundedBox(parent,color,pos,size,radius=.08){
 const m=new THREE.Mesh(new RoundedBoxGeometry(size[0],size[1],size[2],4,radius),mat(color));
 m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function sphere(parent,color,pos,scale=[1,1,1]){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.5,28,20),mat(color));
 m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function capsule(parent,color,pos,radius,length,rotation=[0,0,0]){
 const m=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length,6,18),mat(color));
 m.position.set(...pos);m.rotation.set(...rotation);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}

// 시골 배경
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x91b879));
ground.rotation.x=-Math.PI/2;ground.position.y=-.15;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,65),mat(0xc9a77c));
road.rotation.x=-Math.PI/2;road.position.set(0,-.07,-12);scene.add(road);

for(let i=0;i<55;i++){
 const s=.035+Math.random()*.09;
 const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(s),mat(Math.random()>.5?0x948875:0xb9a48b));
 stone.position.set((Math.random()-.5)*5.8,-.015,-30+Math.random()*35);
 stone.scale.set(1.5,.4,1);scene.add(stone);
}
for(let i=0;i<65;i++){
 const side=Math.random()>.5?1:-1,x=side*(4+Math.random()*7),z=-28+Math.random()*35;
 capsule(scene,0x547b45,[x,.2,z],.035,.35,[0,0,(Math.random()-.5)*.8]);
}
for(const side of [-1,1]){
 for(let i=0;i<10;i++)roundedBox(scene,0x806044,[side*5.2,.55,-27+i*3],[.16,1.1,.16],.04);
 for(const y of [.45,.85])roundedBox(scene,0x9a7955,[side*5.2,y,-13],[.13,.13,30],.04);
}
for(let i=0;i<12;i++){
 const h=2+Math.random()*3;
 sphere(scene,0x83ad78,[-22+i*4,h*.25,-27],[7,h*2,4]);
}
for(let i=0;i<8;i++){
 const cloud=new THREE.Group();
 sphere(cloud,0xfff9ed,[0,0,0],[3,.9,1.4]);
 sphere(cloud,0xfff9ed,[-.8,-.1,.05],[1.7,.8,1.2]);
 sphere(cloud,0xfff9ed,[.85,-.1,0],[1.8,.9,1.2]);
 cloud.position.set(-14+i*4,9+(i%3),-20);scene.add(cloud);
}

// 자경이
const victim=new THREE.Group();
scene.add(victim);
victim.position.set(0,-.1,-.25);
victim.scale.setScalar(1.5);

const torso=new THREE.Group();
torso.position.set(0,.25,0);
victim.add(torso);
roundedBox(torso,0xf0eee5,[0,-.15,0],[1.25,1.65,.68],.13);
capsule(torso,0xe8b18f,[0,.73,0],.18,.22);

for(const side of [-1,1]){
 roundedBox(torso,0xf0eee5,[side*.66,.02,0],[.4,1.0,.55],.17);
 capsule(torso,0xe8b18f,[side*.66,-.55,.02],.13,.18);
 roundedBox(torso,0x795338,[side*.3,.05,.355],[.1,1.05,.045],.025);
}

const head=new THREE.Group();
head.position.set(0,1.1,0);
torso.add(head);
sphere(head,0xe8b18f,[0,0,0],[.88,.9,.78]);

// 머리카락: 두 파츠가 아닌 한 덩어리로 정리
const hair=sphere(head,0x211d20,[0,.25,-.03],[.91,.67,.83]);
hair.rotation.z=-.09;
const fringe=sphere(head,0x211d20,[0,.38,.19],[.85,.25,.54]);
fringe.rotation.z=-.18;

for(const side of [-1,1])sphere(head,0xe8b18f,[side*.43,-.04,.02],[.15,.19,.13]);

const glasses=new THREE.Group();
head.add(glasses);
for(const side of [-1,1]){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.023,8,24),mat(0x242424));
 ring.position.set(side*.19,.02,.4);glasses.add(ring);
 sphere(glasses,0x242424,[side*.19,.02,.42],[.035,.05,.025]);
}
roundedBox(glasses,0x242424,[0,.02,.41],[.09,.025,.025],.01);

const angryBrows=new THREE.Group();
head.add(angryBrows);
for(const side of [-1,1]){
 const brow=roundedBox(angryBrows,0x241d19,[side*.19,.24,.43],[.2,.045,.025],.01);
 brow.rotation.z=side<0?-.28:.28;
}
angryBrows.visible=false;

// 책
const book=new THREE.Group();
book.position.set(.52,-.3,.35);
book.rotation.z=-.1;torso.add(book);
roundedBox(book,0x70432f,[0,0,0],[.35,.53,.09],.03);
roundedBox(book,0xe9d9b9,[0,0,.055],[.29,.47,.02],.02);

// 팔: 어깨 축에 소매와 손을 붙여 하나의 그룹으로 구성
function createArm(sleeveColor,side){
 const pivot=new THREE.Group();
 scene.add(pivot);
 pivot.position.set(side*1.55,3.05,3.15);

 // 소매는 어깨에서 아래로 이어지는 넓은 둥근 네모
 roundedBox(pivot,sleeveColor,[0,-.68,0],[.68,1.55,.58],.23);

 // 손은 소매 끝에 바로 연결
 sphere(pivot,0xf1c19d,[0,-1.57,.015],[.48,.48,.44]);

 return pivot;
}

const leftArm=createArm(0x59734e,-1);
const rightArm=createArm(0x84968b,1);

const leftBase=1.0;
const rightBase=-1.0;
leftArm.rotation.z=leftBase;
rightArm.rotation.z=rightBase;

let leftSwing=0;
let rightDrag=0;

// 아이템
const itemHolder=new THREE.Group();
scene.add(itemHolder);
const itemNames=['지갑','돈','담뱃갑','모자','라이터','돌','벽돌','막대기','수배 전단지','옥수수'];
const catchItems=new Set(['지갑','돈','담뱃갑','모자','라이터']);

let currentItem=null,currentName='';
let itemTimer=0,spawnTimer=0,score=0,time=60,active=false;
let combo=0,lastName='',repeat=0,dragging=false,startY=0,dragY=0;
let turning=false,turnProgress=0,shake=0;
let phraseIndex=0;

function makeItem(name){
 const g=new THREE.Group();

 if(name==='지갑'){
  roundedBox(g,0x754a34,[0,0,0],[.56,.38,.12],.045);
  roundedBox(g,0x9a7354,[0,.02,.07],[.48,.06,.02],.015);
  sphere(g,0xd9b56c,[.17,0,.09],[.1,.12,.06]);
 }else if(name==='돈'){
  roundedBox(g,0xf5f0dc,[0,0,0],[.62,.4,.035],.02);
  roundedBox(g,0x304d76,[0,0,.025],[.54,.32,.012],.015);
  sphere(g,0xf5f0dc,[0,0,.04],[.18,.2,.02]);
 }else if(name==='담뱃갑'){
  roundedBox(g,0xe7e0cb,[0,0,0],[.37,.54,.18],.03);
  roundedBox(g,0xb43e37,[0,.17,.1],[.37,.17,.02],.01);
  roundedBox(g,0xeeeeea,[0,-.12,.1],[.37,.16,.02],.01);
 }else if(name==='모자'){
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,.25,24),mat(0x284455));
  crown.position.y=.06;g.add(crown);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.06,24),mat(0x284455));
  brim.position.y=-.09;g.add(brim);
 }else if(name==='라이터'){
  roundedBox(g,0xb9c1c5,[0,0,0],[.27,.42,.17],.035);
  roundedBox(g,0x727b80,[.03,.23,0],[.15,.07,.18],.015);
 }else if(name==='돌'){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.3),mat(0x747b79));
  rock.scale.set(1.2,.9,1);g.add(rock);
 }else if(name==='벽돌'){
  roundedBox(g,0xa95b47,[0,0,0],[.72,.4,.28],.035);
  // 벽돌의 구멍 두 개
  for(const x of [-.19,.19]){
   const hole=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.025,16),mat(0x633c34));
   hole.rotation.x=Math.PI/2;
   hole.position.set(x,0,.15);g.add(hole);
  }
 }else if(name==='막대기'){
  capsule(g,0x79532f,[0,0,0],.075,.85,[0,0,Math.PI/2]);
 }else if(name==='옥수수'){
  // 길고 노란 몸통, 짧고 둥근 초록 껍질
  capsule(g,0xe9c442,[0,0,0],.19,.78,[0,0,Math.PI/2]);
  sphere(g,0x4f8745,[-.32,-.08,.02],[.12,.18,.1]);
  sphere(g,0x65974b,[.32,-.08,.02],[.12,.18,.1]);
 }else if(name==='수배 전단지'){
  roundedBox(g,0xf3e8d0,[0,0,0],[.62,.48,.035],.015);
  const outline=new THREE.Mesh(new THREE.TorusGeometry(.12,.009,6,24),mat(0x514b45));
  outline.position.set(0,.025,.035);g.add(outline);
  for(const x of [-.045,.045])sphere(g,0x514b45,[x,.04,.05],[.018,.018,.01]);
  // 코 생략, 부드러운 W자 입
  const points=[[-.09,-.065],[-.045,-.09],[0,-.065],[.045,-.09],[.09,-.065]];
  for(let i=0;i<4;i++){
   const a=points[i],b=points[i+1];
   const dx=b[0]-a[0],dy=b[1]-a[1];
   const line=roundedBox(g,0x514b45,[(a[0]+b[0])/2,(a[1]+b[1])/2,.055],[Math.hypot(dx,dy),.009,.009],.003);
   line.rotation.z=Math.atan2(dy,dx);
  }
  for(let i=0;i<2;i++)roundedBox(g,0x777066,[0,-.17-i*.04,.03],[.3-i*.04,.009,.008],.003);
 }
 return g;
}

function nextName(){
 let n;
 do{n=itemNames[Math.floor(Math.random()*itemNames.length)];}
 while(n===lastName&&repeat>=2);
 if(n===lastName)repeat++;
 else{lastName=n;repeat=1}
 return n;
}

function sound(freq,duration){
 try{
  const ctx=sound.ctx||(sound.ctx=new AudioContext());
  if(ctx.state==='suspended')ctx.resume();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.type='triangle';osc.frequency.value=freq;
  gain.gain.setValueAtTime(.07,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.start();osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

function spawn(){
 currentName=nextName();
 currentItem=makeItem(currentName);
 itemHolder.add(currentItem);
 itemHolder.position.set(0,1.85,3.0);
 itemTimer=0;
 sound(520,.08);
}

function clearItem(){
 if(currentItem){itemHolder.remove(currentItem);currentItem=null;}
}

function finish(){
 if(!active)return;
 active=false;
 clearItem();
 turning=true;
 turnProgress=0;
 shake=.4;
 sound(110,.4);
 $('result').textContent=`훔친 물건 ${score}개`;
}

function judge(direction){
 if(!active||!currentItem)return;
 const isCatch=catchItems.has(currentName);
 const correct=(isCatch&&direction==='down')||(!isCatch&&direction==='up');
 if(!correct){finish();return;}

 if(isCatch){
  score++;
  $('score').textContent=score;
  sound(780,.1);
 }else sound(250,.1);

 combo++;
 if(combo%5===0)sound(1000,.18);
 clearItem();
 spawnTimer=Math.max(.22,.65-(60-time)*.006);
}

// 조작
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!active||!currentItem)return;
 dragging=true;
 startY=e.clientY;
 dragY=0;
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 dragY=e.clientY-startY;
 const v=THREE.MathUtils.clamp(dragY/160,-1,1);
 rightDrag=v;
 rightArm.rotation.z=rightBase-v*.22;
 rightArm.rotation.x=-v*.1;
});
window.addEventListener('pointerup',()=>{
 if(!dragging)return;
 dragging=false;
 if(Math.abs(dragY)>15)judge(dragY>0?'down':'up');
 rightDrag=0;
});

// 시작
function startGame(){
 active=true;
 time=60;score=0;combo=0;spawnTimer=.3;
 lastName='';repeat=0;
 turning=false;turnProgress=0;
 victim.rotation.y=Math.PI;
 angryBrows.visible=false;
 leftArm.rotation.z=leftBase;
 rightArm.rotation.z=rightBase;
 clearItem();
 $('time').textContent=60;
 $('score').textContent=0;
 $('start').classList.add('hidden');
 $('end').classList.add('hidden');
 $('hint').classList.remove('hidden');
 $('speech').classList.remove('hidden');
 phraseIndex=0;
 $('speech').textContent='척하면 척!';
}
$('startBtn').onclick=startGame;
$('again').onclick=startGame;

// 애니메이션
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(active){
  time-=dt;
  $('time').textContent=Math.max(0,Math.ceil(time));
  if(time<=0)finish();

  if(active&&!currentItem){
   spawnTimer-=dt;
   if(spawnTimer<=0)spawn();
  }else if(active&&currentItem){
   itemTimer+=dt;
   currentItem.rotation.y=Math.sin(now*.002)*.035;
   if(itemTimer>=3)finish();
  }

  // 두 문구가 일정 간격으로 번갈아 등장
  phraseIndex+=dt;
  if(phraseIndex>=2.2){
   phraseIndex=0;
   $('speech').textContent=$('speech').textContent==='척하면 척!'?'딱하면 딱!':'척하면 척!';
  }

  // 왼팔은 어깨 축에 붙어 와이퍼처럼 반원 운동
  leftSwing=Math.sin(now*.0018)*.42;
  leftArm.rotation.z=leftBase+leftSwing;
 }

 if(turning){
  turnProgress=Math.min(1,turnProgress+dt*1.8);
  const eased=1-Math.pow(1-turnProgress,3);
  victim.rotation.y=Math.PI*(1-eased);
  angryBrows.visible=true;

  if(turnProgress>=1){
   turning=false;
   $('speech').textContent='지금 뭐 하시는 거예요?';
   $('speech').classList.remove('hidden');
   $('end').classList.remove('hidden');
   $('hint').classList.add('hidden');
  }
 }

 if(shake>0){
  shake=Math.max(0,shake-dt);
  camera.position.x=(Math.random()-.5)*shake*.1;
 }else camera.position.x=0;

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
